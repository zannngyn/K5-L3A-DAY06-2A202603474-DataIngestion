<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Day 06 · Data Ingestion — Demo</title>
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230d5961%27/%3E%3Cpath d=%27M9 22V10h6a4 4 0 010 8H9%27 fill=%27none%27 stroke=%27%23fffdf8%27 stroke-width=%273%27/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --paper: #f6f3ec;
      --paper-2: #eee9dd;
      --sheet: #fffdf8;
      --ink: #1b1d22;
      --ink-2: #474c56;
      --ink-3: #6a6f78;
      --rule: #d8d1c1;
      --rule-strong: #b9b09c;
      --accent: #0d5961;
      --accent-soft: #d6e8e6;
      --cfg-a: #9c4417;
      --cfg-b: #2f4196;
      --cfg-c: #0d5961;
      --ok: #1d6638;
      --ok-soft: #dcefe1;
      --bad: #a1202a;
      --bad-soft: #f6dcdc;
      --warn: #7f5200;
      --warn-soft: #f7e8c6;
      --mark: #ffe08a;
      --mark-partial: #f3d2b4;
      --serif: "Iowan Old Style", "Charter", "Palatino Linotype", Palatino, Georgia, serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --ease: cubic-bezier(.16, 1, .3, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
    }

    body {
      background: #2b2d31;
      color: var(--ink);
      font-family: var(--sans);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    ::selection {
      background: var(--mark);
      color: var(--ink);
    }

    :focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
      border-radius: 4px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    /* Stage: fixed 1600x900 canvas scaled to the viewport */
    .viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    .stage {
      width: 1600px;
      height: 900px;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(var(--k, 1));
      transform-origin: center;
      background: var(--paper);
      position: relative;
      box-shadow: 0 30px 80px -20px rgb(0 0 0 / .5);
      overflow: hidden;
    }

    .slide {
      position: absolute;
      inset: 0;
      padding: 64px 88px 96px;
      display: none;
      flex-direction: column;
    }

    .slide.is-active {
      display: flex;
      animation: enter .55s var(--ease) both;
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(14px);
        filter: blur(3px);
      }

      to {
        opacity: 1;
        transform: none;
        filter: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .slide.is-active {
        animation: none;
      }
    }

    .chrome {
      position: absolute;
      left: 88px;
      right: 88px;
      bottom: 28px;
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: .9375rem;
      color: var(--ink-3);
      z-index: 5;
    }

    .chrome .credit {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chrome .credit a {
      color: inherit;
    }

    .progress {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 5px;
      background: var(--accent);
      transform-origin: left;
      transition: transform .5s var(--ease);
      z-index: 5;
    }

    .navbtn {
      display: inline-grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border: 1px solid var(--rule-strong);
      border-radius: 999px;
      background: var(--sheet);
      color: var(--ink);
      cursor: pointer;
    }

    .navbtn:hover {
      background: var(--paper-2);
    }

    .navbtn:disabled {
      opacity: .35;
      cursor: default;
    }

    .navbtn svg {
      width: 18px;
      height: 18px;
    }

    .counter {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      color: var(--ink-2);
      min-width: 4.5em;
      text-align: center;
    }

    /* Type */
    h1,
    h2,
    h3 {
      font-family: var(--serif);
      font-weight: 600;
      letter-spacing: -.01em;
      margin: 0;
      text-wrap: balance;
    }

    h2 {
      font-size: 3.25rem;
      line-height: 1.05;
      margin-bottom: 14px;
    }

    h3 {
      font-size: 1.625rem;
      line-height: 1.2;
    }

    .lede {
      font-size: 1.5rem;
      line-height: 1.45;
      color: var(--ink-2);
      max-width: 62ch;
      margin: 0 0 28px;
    }

    p {
      margin: 0;
    }

    .num {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
    }

    .muted {
      color: var(--ink-3);
    }

    .small {
      font-size: 1rem;
    }

    code {
      font-family: var(--mono);
      font-size: .9em;
      background: var(--paper-2);
      padding: 1px 6px;
      border-radius: 4px;
    }

    /* Title slide */
    .title-slide {
      justify-content: flex-end;
      padding-bottom: 150px;
      background:
        linear-gradient(var(--paper), var(--paper)) padding-box;
    }

    .title-slide .ruled {
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(to bottom, transparent 0 47px, rgb(13 89 97 / .08) 47px 48px);
      pointer-events: none;
    }

    .title-slide .margin {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 64px;
      width: 2px;
      background: rgb(161 32 42 / .25);
    }

    .title-slide h1 {
      font-size: 6rem;
      line-height: .98;
      letter-spacing: -.03em;
      max-width: 14ch;
    }

    .title-slide .sub {
      font-size: 1.75rem;
      color: var(--ink-2);
      margin-top: 28px;
      max-width: 48ch;
      line-height: 1.4;
    }

    .title-slide .who {
      margin-top: 44px;
      display: flex;
      gap: 40px;
      font-size: 1.25rem;
      color: var(--ink-2);
    }

    .title-slide .who b {
      color: var(--ink);
      font-weight: 600;
    }

    .hint {
      position: absolute;
      right: 88px;
      top: 64px;
      font-size: 1rem;
      color: var(--ink-3);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    kbd {
      font-family: var(--mono);
      font-size: .85em;
      border: 1px solid var(--rule-strong);
      border-bottom-width: 2px;
      border-radius: 6px;
      padding: 1px 7px;
      background: var(--sheet);
      color: var(--ink);
    }

    /* Generic layout helpers */
    .row {
      display: flex;
      gap: 48px;
    }

    .grow {
      flex: 1;
      min-width: 0;
    }

    .stack>*+* {
      margin-top: 14px;
    }

    .rule-top {
      border-top: 1px solid var(--rule);
      padding-top: 18px;
    }

    .facts {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 10px 28px;
      font-size: 1.25rem;
      line-height: 1.4;
    }

    .facts dt {
      color: var(--ink-3);
    }

    .facts dd {
      margin: 0;
    }

    .bignum {
      font-family: var(--serif);
      font-size: 4.5rem;
      line-height: 1;
      letter-spacing: -.02em;
    }

    /* Page strip */
    .strip {
      display: grid;
      grid-template-columns: repeat(80, 1fr);
      gap: 3px;
      margin: 8px 0 14px;
    }

    .strip i {
      height: 66px;
      border-radius: 2px;
      background: var(--paper-2);
      border: 1px solid var(--rule);
    }

    .strip i.c1 {
      background: var(--cfg-b);
      border-color: var(--cfg-b);
    }

    .strip i.c2 {
      background: var(--accent);
      border-color: var(--accent);
    }

    .strip i.end {
      background: repeating-linear-gradient(135deg, var(--rule) 0 3px, var(--paper-2) 3px 7px);
    }

    .strip-axis {
      display: grid;
      grid-template-columns: repeat(80, 1fr);
      gap: 3px;
      font-family: var(--mono);
      font-size: .8125rem;
      color: var(--ink-3);
    }

    .strip-axis span {
      text-align: left;
      white-space: nowrap;
    }

    .legend {
      display: flex;
      gap: 28px;
      font-size: 1.0625rem;
      color: var(--ink-2);
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .legend span {
      display: inline-flex;
      gap: 10px;
      align-items: center;
    }

    .legend i {
      width: 18px;
      height: 18px;
      border-radius: 3px;
      display: inline-block;
    }

    /* Pipeline */
    .flow {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0;
      margin-top: 18px;
      position: relative;
    }

    .flow li {
      list-style: none;
      padding: 26px 22px 24px;
      border-top: 3px solid var(--ink);
      position: relative;
    }

    .flow li+li {
      border-left: 1px solid var(--rule);
    }

    .flow .step {
      font-family: var(--serif);
      font-size: 1.625rem;
      font-weight: 600;
    }

    .flow .val {
      font-family: var(--serif);
      font-size: 2.75rem;
      line-height: 1;
      margin: 22px 0 8px;
      letter-spacing: -.02em;
    }

    .flow .unit {
      color: var(--ink-2);
      font-size: 1.0625rem;
      line-height: 1.4;
    }

    .flow .tool {
      margin-top: 18px;
      font-size: .9375rem;
      color: var(--ink-3);
      line-height: 1.45;
    }

    .flow ol {
      margin: 0;
      padding: 0;
      display: contents;
    }

    /* Before / after text panes */
    .pane {
      background: var(--sheet);
      border: 1px solid var(--rule);
      border-radius: 10px;
      padding: 22px 26px;
      overflow: auto;
    }

    .pane h3 {
      font-size: 1.25rem;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .pane h3 .muted {
      font-family: var(--sans);
      font-weight: 400;
      font-size: 1rem;
    }

    .rawlines {
      font-family: var(--mono);
      font-size: .96rem;
      line-height: 1.55;
      white-space: pre-wrap;
      margin: 0;
    }

    .rawlines .drop {
      color: var(--bad);
      text-decoration: line-through;
      text-decoration-thickness: 2px;
      background: var(--bad-soft);
    }

    .rawlines .join {
      background: var(--warn-soft);
    }

    .prose {
      font-family: var(--serif);
      font-size: 1.1875rem;
      line-height: 1.6;
    }

    .prose p+p {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed var(--rule);
    }

    .ops {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 18px;
      font-size: 1.0625rem;
    }

    .ops span {
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--sheet);
      border: 1px solid var(--rule);
    }

    /* Config identity */
    .cfg {
      display: inline-grid;
      place-items: center;
      width: 1.9em;
      height: 1.9em;
      border-radius: 8px;
      color: #fff;
      font-family: var(--serif);
      font-weight: 700;
      font-size: 1em;
      flex: none;
    }

    .cfgname {
      display: inline-flex;
      gap: 12px;
      align-items: center;
    }

    .cfg.A {
      background: var(--cfg-a);
    }

    .cfg.B {
      background: var(--cfg-b);
    }

    .cfg.C {
      background: var(--cfg-c);
    }

    /* Chunk comparison */
    .chunk {
      font-family: var(--serif);
      font-size: 1.1875rem;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .cut {
      color: var(--bad);
      font-family: var(--mono);
      font-weight: 700;
      padding: 0 3px;
      background: var(--bad-soft);
      border-radius: 3px;
    }

    /* Tables */
    table.data {
      border-collapse: collapse;
      width: 100%;
      font-size: 1.1875rem;
    }

    table.data th,
    table.data td {
      text-align: left;
      padding: 12px 16px;
      border-bottom: 1px solid var(--rule);
      vertical-align: top;
    }

    table.data th {
      font-weight: 600;
      color: var(--ink-2);
      font-size: 1rem;
      border-bottom: 2px solid var(--ink);
    }

    table.data td.n,
    table.data th.n {
      text-align: right;
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
    }

    table.data tr.chosen td {
      background: var(--accent-soft);
    }

    .tag {
      font-family: var(--sans);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: .875rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .tag.ok {
      background: var(--ok-soft);
      color: var(--ok);
    }

    .tag.bad {
      background: var(--bad-soft);
      color: var(--bad);
    }

    .tag.warn {
      background: var(--warn-soft);
      color: var(--warn);
    }

    .tag.neutral {
      background: var(--paper-2);
      color: var(--ink-2);
    }

    .tag svg {
      width: 14px;
      height: 14px;
    }

    /* Bars */
    .bars {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 36px 64px;
    }

    .metric h3 {
      font-size: 1.375rem;
      margin-bottom: 14px;
      display: flex;
      gap: 12px;
      align-items: baseline;
    }

    .metric h3 .muted {
      font-family: var(--sans);
      font-size: 1rem;
      font-weight: 400;
    }

    .bar {
      display: grid;
      grid-template-columns: 44px 1fr 92px;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
    }

    .bar .track {
      height: 30px;
      background: var(--paper-2);
      border-radius: 4px;
      overflow: hidden;
    }

    .bar .fill {
      height: 100%;
      border-radius: 4px 0 0 4px;
      transform-origin: left;
      animation: grow .9s var(--ease) both;
    }

    .bar .fill.A {
      background: var(--cfg-a);
    }

    .bar .fill.B {
      background: var(--cfg-b);
    }

    .bar .fill.C {
      background: var(--cfg-c);
    }

    .bar .v {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      font-size: 1.125rem;
      text-align: right;
    }

    @keyframes grow {
      from {
        transform: scaleX(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .bar .fill {
        animation: none;
      }
    }

    .callout {
      font-size: 1.1875rem;
      line-height: 1.5;
      color: var(--ink-2);
      padding: 16px 20px;
      background: var(--sheet);
      border: 1px solid var(--rule);
      border-radius: 10px;
    }

    .callout b {
      color: var(--ink);
    }

    /* Failure list */
    .fails {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 56px;
    }

    .fail {
      padding: 22px 0;
      border-top: 1px solid var(--rule);
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 18px;
    }

    .fail .id {
      font-family: var(--mono);
      font-size: 1.5rem;
      font-weight: 700;
      grid-row: span 3;
    }

    .fail h3 {
      font-size: 1.375rem;
    }

    .fail p {
      color: var(--ink-2);
      font-size: 1.125rem;
      line-height: 1.5;
    }

    .linkbtn {
      justify-self: start;
      display: inline-flex;
      gap: 8px;
      align-items: center;
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      color: var(--accent);
      background: none;
      border: 0;
      padding: 6px 0;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .linkbtn svg {
      width: 16px;
      height: 16px;
    }

    /* Explorer */
    .ex-head {
      display: flex;
      align-items: flex-end;
      gap: 28px;
      margin-bottom: 14px;
    }

    .ex-head h2 {
      font-size: 2.5rem;
      margin: 0;
    }

    .seg {
      display: inline-flex;
      border: 1px solid var(--rule-strong);
      border-radius: 999px;
      padding: 3px;
      background: var(--sheet);
    }

    .seg button {
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      border: 0;
      background: none;
      padding: 6px 16px;
      border-radius: 999px;
      color: var(--ink-2);
      cursor: pointer;
    }

    .seg button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--sheet);
    }

    .chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chips button {
      font-family: var(--mono);
      font-size: .9375rem;
      border: 1px solid var(--rule-strong);
      background: var(--sheet);
      color: var(--ink);
      padding: 5px 10px;
      border-radius: 7px;
      cursor: pointer;
      display: inline-flex;
      gap: 6px;
      align-items: center;
    }

    .chips button:hover {
      background: var(--paper-2);
    }

    .chips button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--sheet);
      border-color: var(--ink);
    }

    .chips .dots {
      display: inline-flex;
      gap: 2px;
    }

    .chips .dots i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--rule-strong);
    }

    .chips .dots i.h1 {
      background: var(--ok);
    }

    .chips .dots i.h3 {
      background: #8fbf9f;
    }

    .chips .dots i.miss {
      background: var(--bad);
    }

    .chips button[aria-pressed="true"] .dots i {
      outline: 1px solid var(--sheet);
    }

    .qbox {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 28px;
      padding: 16px 20px;
      background: var(--sheet);
      border: 1px solid var(--rule);
      border-radius: 10px;
      margin-bottom: 14px;
    }

    .qbox .q {
      font-family: var(--serif);
      font-size: 1.5rem;
      line-height: 1.3;
    }

    .qbox .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin-top: 10px;
      font-size: 1rem;
      color: var(--ink-2);
    }

    .qbox .ev {
      font-family: var(--serif);
      font-size: 1.0625rem;
      line-height: 1.5;
      color: var(--ink-2);
    }

    .qbox .ev mark {
      background: var(--mark);
      color: var(--ink);
      padding: 0 2px;
    }

    .cols {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      flex: 1;
      min-height: 0;
    }

    .col {
      display: flex;
      flex-direction: column;
      min-height: 0;
      border: 1px solid var(--rule);
      border-radius: 10px;
      background: var(--sheet);
    }

    .col-h {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid var(--rule);
      flex-wrap: wrap;
    }

    .col-h .name {
      font-weight: 600;
      font-size: 1.0625rem;
      margin-right: auto;
    }

    .col-b {
      overflow: auto;
      padding: 4px 14px 14px;
      flex: 1;
      scrollbar-width: thin;
      scrollbar-color: var(--rule-strong) transparent;
    }

    .hit {
      padding: 12px 0;
      border-bottom: 1px dashed var(--rule);
    }

    .hit:last-child {
      border-bottom: 0;
    }

    .hit-h {
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: .9375rem;
      color: var(--ink-2);
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .hit-h .rank {
      font-family: var(--serif);
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--ink);
    }

    .hit-t {
      font-family: var(--serif);
      font-size: 1rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .hit-t mark {
      background: var(--mark);
      color: var(--ink);
      border-radius: 2px;
    }

    .hit-t mark.partial {
      background: var(--mark-partial);
    }

    .ex-foot {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-top: 12px;
      font-size: 1rem;
      color: var(--ink-3);
    }

    .btn {
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      display: inline-flex;
      gap: 8px;
      align-items: center;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: var(--sheet);
      cursor: pointer;
    }

    .btn.ghost {
      background: var(--sheet);
      color: var(--ink);
      border-color: var(--rule-strong);
    }

    .btn svg {
      width: 16px;
      height: 16px;
    }

    /* Raw CSV panel (in-slide sheet, not a modal) */
    .sheet {
      position: absolute;
      left: 88px;
      right: 88px;
      bottom: 84px;
      top: 150px;
      background: var(--sheet);
      border: 1px solid var(--rule-strong);
      border-radius: 12px;
      box-shadow: 0 24px 60px -18px rgb(27 29 34 / .35);
      display: none;
      flex-direction: column;
      z-index: 4;
    }

    .sheet.is-open {
      display: flex;
      animation: enter .4s var(--ease) both;
    }

    .sheet-h {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 22px;
      border-bottom: 1px solid var(--rule);
    }

    .sheet-h h3 {
      font-size: 1.375rem;
      margin-right: auto;
    }

    .sheet-b {
      overflow: auto;
      padding: 8px 22px 22px;
    }

    .sheet-b h4 {
      font-family: var(--mono);
      font-size: 1rem;
      margin: 18px 0 8px;
      color: var(--ink-2);
      font-weight: 600;
    }

    table.csv {
      border-collapse: collapse;
      font-family: var(--mono);
      font-size: .875rem;
      min-width: 100%;
    }

    table.csv th,
    table.csv td {
      border: 1px solid var(--rule);
      padding: 6px 10px;
      text-align: left;
      vertical-align: top;
      max-width: 440px;
    }

    table.csv th {
      background: var(--paper-2);
      position: sticky;
      top: 0;
      font-weight: 600;
    }

    table.csv td.long {
      white-space: pre-wrap;
      font-family: var(--serif);
      font-size: .9375rem;
      min-width: 320px;
    }

    .empty {
      padding: 28px;
      text-align: center;
      color: var(--ink-2);
      font-size: 1.125rem;
      border: 1px dashed var(--rule-strong);
      border-radius: 10px;
    }

    /* Coherence explorer */
    .coh {
      display: grid;
      grid-template-columns: 210px 1fr 1fr;
      gap: 20px;
      flex: 1;
      min-height: 0;
    }

    .poslist {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: auto;
    }

    .poslist button {
      font: inherit;
      text-align: left;
      border: 1px solid var(--rule);
      background: var(--sheet);
      border-radius: 8px;
      padding: 9px 12px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 1rem;
    }

    .poslist button[aria-pressed="true"] {
      border-color: var(--ink);
      box-shadow: inset 3px 0 0 var(--ink);
    }

    .poslist .scores {
      font-family: var(--mono);
      color: var(--ink-2);
    }

    .score {
      font-family: var(--serif);
      font-size: 2.25rem;
      line-height: 1;
    }

    .reason {
      font-size: 1.0625rem;
      line-height: 1.5;
      color: var(--ink-2);
      padding: 12px 14px;
      border-top: 1px solid var(--rule);
    }

    /* Conclusion */
    .concl {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 64px;
    }

    .concl ul {
      margin: 0;
      padding-left: 1.1em;
      font-size: 1.3125rem;
      line-height: 1.5;
    }

    .concl li+li {
      margin-top: 12px;
    }

    .concl li::marker {
      color: var(--accent);
    }

    .verdict {
      font-family: var(--serif);
      font-size: 2.25rem;
      line-height: 1.2;
      margin-bottom: 26px;
    }

    .verdict .cfg {
      font-size: .9em;
      vertical-align: -.1em;
      margin-right: 8px;
    }

    @media print {
      body {
        background: #fff;
        overflow: visible;
      }

      .viewport {
        position: static;
        display: block;
      }

      .stage {
        transform: none !important;
        position: static;
        box-shadow: none;
        height: auto;
        overflow: visible;
      }

      .slide {
        display: flex !important;
        position: relative;
        height: 900px;
        page-break-after: always;
        animation: none !important;
      }

      .chrome,
      .progress,
      .sheet {
        display: none !important;
      }
    }

 1, "chunk_id": "openstax-intro-sociology-3e-p028-fixed-005", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 28, "chapter": 1, "section": "1.2", "score": 0.650664, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "t of the group. Calling this idea ‘the looking-glass self,’ Cooley argued that we ‘see’ ourselves by the reactions of others with whom we interact. If someone reacts positively to our behavior, theoretically we will continue that behavior. He wrote substantially on what he saw as the order of life in Human Nature and the Social Order (1902) followed by Social Organization in 1909. He was very concerned with the increasing individualism and competitiveness of US society, fearing it would disrupt "}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p028-fixed-007", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 28, "chapter": 1, "section": "1.2", "score": 0.605669, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": " adopted Cooley’s concept of ‘looking-glasses,’ Mead felt that an individual’s reaction to a positive or negative reflection depended on who the ‘other’ was. Individuals that had the greatest impact on a person’s life were significant others while generalized others were the organized and generalized attitude of a social group. Mead often shares the title of father of symbolic interactionism with Cooley and Erving Goffman. Robert E. Park (1864-1944)\n\nRobert E. Park is best known as the founder o"}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p028-fixed-006", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 28, "chapter": 1, "section": "1.2", "score": 0.600318, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "itiveness of US society, fearing it would disrupt families as primary groups lost their importance.\n\nGeorge Herbert Mead (1863–1931)\n\nGeorge Herbert Mead was a philosopher and sociologist whose work focused on the ways in which the mind and the self were developed as a result of social processes (Cronk, n.d.). He argued that how an individual comes to view himself or herself is based to a very large extent on interactions with others. Though Mead adopted Cooley’s concept of ‘looking-glasses,’ Me"}], "config": "A", "index": "A"}, {"id": "q08", "split": "dev", "type": "direct", "question": "According to Robert Merton, what is the difference between manifest and latent functions?", "expected_answer": "Manifest functions are sought or anticipated consequences of a social process; latent functions are unsought consequences.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [30], "evidence_quote": "Manifest functions are the consequences of a social process that are sought or anticipated, while latent functions are the unsought consequences of a social process.", "filter": null, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p030-fixed-007", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 30, "chapter": 1, "section": "1.3", "score": 0.822924, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "al functionalist, Robert Merton (1910–2003), pointed out that social processes often have many functions. Manifest functions are the consequences of a social process that are sought or anticipated, while latent functions are the unsought consequences of a social process. A manifest function of a college education, for example, includes gaining knowledge, preparing for a career, and finding a good job that utilizes that education. Latent functions of your college years include meeting new people,"}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p030-fixed-006", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 30, "chapter": 1, "section": "1.3", "score": 0.627112, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "ts such as Parsons (1961). Durkheim believed that individuals may make up society, but in order to study society, sociologists have to look beyond individuals to social facts. Each of these social facts serves one or more functions within a society. For example, one function of a society’s laws may be to protect society from violence, while another is to punish criminal behavior, while another is to preserve public health.\n\nAnother noted structural functionalist, Robert Merton (1910–2003), point"}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p031-fixed-000", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 31, "chapter": 1, "section": "1.3", "score": 0.57858, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "a hierarchy of employment based on the level of education attained. Latent functions can be beneficial, neutral, or harmful. Social processes that have undesirable consequences for the operation of society are called dysfunctions. In education, examples of dysfunction include getting bad grades, truancy, dropping out, not graduating, and not finding suitable employment.\n\nCriticism\n\nOne criticism of the structural-functional theory is that it can’t adequately explain social change even though the"}], "config": "A", "index": "A"}, {"id": "q09", "split": "dev", "type": "paraphrase", "question": "Which technique used theater as an analogy for social interaction, and who developed it?", "expec  these basic premises: humans interact with things based on meanings ascribed to those things; the ascribed meaning of things comes from our interac"}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p033-fixed-008", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 33, "chapter": 1, "section": "1.3", "score": 0.535435, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "ng your library card was treated as a special event, or bedtime stories were associated with warmth and comfort.\n\nSocial scientists who apply symbolic-interactionist thinking look for patterns of interaction between individuals. Their studies often involve observation of one-on-one interactions. For example, while a conflict theorist studying a political protest might focus on class difference, a symbolic interactionist would be more interested in how individuals in the protesting group interact"}], "config": "A", "index": "A"}, {"id": "q10", "split": "dev", "type": "direct", "question": "In the hypothesis 'if unemployment increases, then the crime rate will increase', which is the independent variable and which is the dependent variable?", "expected_answer": "Unemployment is the independent variable; the crime rate is the dependent variable.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [50], "evidence_quote": "unemployment is the independent variable and the crime rate is the dependent variable.", "filter": null, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p050-fixed-004", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 50, "chapter": 2, "section": "2.1", "score": 0.833833, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "esearch, we formulate hypotheses to include an independent variable (IV), which is the cause of the change, and a dependent variable (DV), which is the effect, or thing that is changed. In the example above, unemployment is the independent variable and the crime rate is the dependent variable.\n\nIn a sociological study, the researcher would establish one form of human behavior as the independent variable and observe the influence it has on a dependent variable. How does gender (the independent va"}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p050-fixed-003", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 50, "chapter": 2, "section": "2.1", "score": 0.757008, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "pothesis\n\nA hypothesis is an explanation for a phenomenon based on a conjecture about the relationship between the phenomenon and one or more causal factors. In sociology, the hypothesis will often predict how one form of human behavior influences another. For example, a hypothesis might be in the form of an “if, then” statement. Let’s relate this to our topic of crime: If unemployment increases, then the crime rate will increase. In scientific research, we formulate hypotheses to include an ind"}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p050-fixed-005", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 50, "chapter": 2, "section": "2.1", "score": 0.679683, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "dent variable. How does gender (the independent variable) affect rate of income (the dependent variable)? How does one’s religion (the independent variable) affect family size (the dependent variable)? How is social class (the dependent variable) affected by level of education (the independent variable)?\n\nHypothesis Independent\n\nVariable\n\nDependent\n\nVariable\n\nThe greater the availability of affordable housing, the lower the\n\nhomeless rate. Affordable Housing Homeless Rate The greater the availab"}], "config": "A", "index": "A"}, {"id": "q11", "split": "dev", "type": "paraphrase", "question": "Which research quality describes how well a study measures what it was designed to measure?", "expected_answer": "Validity.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [51], "evidence_quote": "Researchers also strive for validity, which refers to how well the study measures what it was designed to measure.", "filter": null, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p051-fixed-003", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 51, "chapter": 2, "section": "2.1", "score": 0.698951, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "d, to measure ingredients rather than a cup, the same result may not be replicated. Accurate tools and methods increase reliability.\n\nResearchers also strive for validity, which refers to how well the study measures what it was designed to measure. To produce reliable and valid results, sociologists develop an operational definition, that is, they define each concept, or variable, in terms of the physical or concrete steps it takes to objectively measure it. The operational definition identifies"}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p048-fixed-000", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 48, "chapter": 2, "section": "2.0", "score": 0.620246, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "approaches and methods sociologists use to conduct studies like this one.\n\n2.1 Approaches to Sociological Research\n\nLEARNING OBJECTIVES\n\nBy the end of this section, you should be able to:\n\n• Define and describe the scientific method.\n\n• Explain how the scientific method is used in sociological research.\n\n• Describe the function and importance of an interpretive framework.\n\n• Describe the differences in accuracy, reliability and validity in a research study.\n\nWhen sociologists apply the sociologi"}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p052-fixed-006", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 52, "chapter": 2, "section": "2.2", "score": 0.564549, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "his section, you should be able to:\n\n• Recall the 6 Steps of the Scientific Method\n\n• Differentiate between four kinds of research methods: surveys, field research, experiments, and secondary data analysis.\n\n• Explain the appropriateness of specific research approaches for specific topics.\n\nSociologists examine the social world, see a problem or interesting pattern, and set out to study it. They use research methods to design a study. Planning the research design is a key step in any sociologica"}], "config": "A", "index": "A"}, {"id": "q12", "split": "dev", "type": "direct", "question": "What defines a random sample?", "expected_answer": "Every person in the population has the same chance of being chosen for the study.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [54], "evidence_quote": "In a random sample, every person in a population has the same chance of being chosen for the study.", "filter": null, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p054-fixed-002", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 54, "chapter": 2, "section": "2.2", "score": 0.662156, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "or teenagers living with type 1 (juvenile-onset) diabetes. Most researchers choose to survey a small sector of the population, or a sample, a manageable number of subjects who represent a larger population. The success of a study depends on how well a population is represented by the sample. In a random sample, every person in a population has the same chance of being chosen for the study. As a result, a Gallup Poll, if conducted as a nationwide random sampling, should be able to provide an accu"}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p054-fixed-003", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 54, "chapter": 2, "section": "2.2", "score": 0.565831, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "random sampling, should be able to provide an accurate estimate of public opinion whether it contacts 2,000 or 10,000 people.\n\nAfter selecting subjects, the researcher develops a specific plan to ask questions and record responses. It is important to inform subjects of the nature and purpose of the survey up front. If they agree to participate, researchers thank subjects and offer them a chance to see the results of the study if they are interested. The researcher presents the subjects with an i"}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p051-fixed-003", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 51, "chapter": 2, "section": "2.1", "score": 0.452719, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "d, to measure ingredients rather than a cup, the same result may not be replicated. Accurate tools and methods increase reliability.\n\nResearchers also strive for validity, which refers to how well the study measures what it was designed to measure. To produce reliable and valid results, sociologists develop an operational definition, that is, they define each concept, or variable, in terms of the physical or concrete steps it takes to objectively measure it. The operational definition identifies"}], "config": "A", "index": "A"}, {"id": "q13", "split": "dev", "type": "condition_exception", "question": "Why is the Hawthorne effect unavoidable in some research studies?", "expected_answer": "Because sociologists have to make the purpose of the study known, so subjects know they are being observed.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [63], "evidence_quote": "The Hawthorne effect is unavoidable in some research studies because sociologists have to make the purpose of the study known.", "filter": null, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p063-fixed-004", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 63, "chapter": 2, "section": "2.2", "score": 0.804433, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": ".\n\nAnd if a researcher told the students they would be observed as part of a study on measuring the effectiveness of tutoring, the students might not behave naturally. This is called the Hawthorne effect—which occurs when people change their behavior because they know they are being watched as part of a study. The Hawthorne effect is unavoidable in some research studies because sociologists have to make the purpose of the study known. Subjects must be aware that they are being observed, and a ce"}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p053-fixed-001", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 53, "chapter": 2, "section": "2.2", "score": 0.558055, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "sible is not always realistic for other reasons. That option is not available to a researcher studying prison behaviors, early education, or the Ku Klux Klan. Researchers can’t just stroll into prisons, kindergarten classrooms, or Klan meetings and unobtrusively observe behaviors or attract attention. In situations like these, other methods are needed. Researchers choose methods that best suit their study topics, protect research participants or subjects, and that fit with their overall approach"}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p053-fixed-000", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 53, "chapter": 2, "section": "2.2", "score": 0.552379, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "When entering a particular social environment, a researcher must be careful. There are times to remain anonymous and times to be overt. There are times to conduct interviews and times to simply observe. Some participants need to be thoroughly informed; others should not know they are being observed. A researcher wouldn’t stroll into a crime-ridden neighborhood at midnight, calling out, “Any gang members around?” Making sociologists’ presence invisible is not always realistic for other reasons. T"}], "config": "A", "index": "A"}, {"id": "q14", "split": "dev", "type": "metadata_filter", "question": "What did the Frankfurt School develop as an elaboration on Marxist principles?", "expected_answer": "Critical theory.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [32], "evidence_quote": "In the 1930s and 1940s, German philosophers, known as the Frankfurt School, developed critical theory as an elaboration on Marxist principles.", "filter": {"chapter": 1}, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": false, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p032-fixed-006", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 32, "chapter": 1, "section": "1.3", "score": 0.66332, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "power, and reduce dissent. The stronger the bond, the weaker the discord. Resolving conflicts can reduce tension and hostility and can pave the way for future agreements.\n\nIn the 1930s and 1940s, German philosophers, known as the Frankfurt School, developed critical theory as an elaboration on Marxist principles. Critical theory is an expansion of conflict theory and is broader than just sociology, incorporating other social sciences and philosophy. A critical theory is a holistic theory and att"}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p052-fixed-004", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 52, "chapter": 2, "section": "2.1", "score": 0.661242, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "ze findings as they evolve.\n\nCritical Sociology\n\nCritical sociology focuses on deconstruction of existing sociological research and theory. Informed by the work of Karl Marx, scholars known collectively as the Frankfurt School proposed that social science, as much as any academic pursuit, is embedded in the system of power constituted by the set of class, caste, race, gender, and other relationships that exist in the society. Consequently, it cannot be treated as purely objective. Critical socio"}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p034-fixed-006", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 34, "chapter": 1, "section": "1.3", "score": 0.524162, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "ovement forced academics to develop approaches to study these emerging social practices.\n\nConflict theory then gained prominence, with its emphasis on institutionalized social inequality. Critical theory, and the particular aspects of feminist theory and critical race theory, focused on creating social change through the application of sociological principles. The field saw a renewed emphasis on helping ordinary people understand sociology principles, in the form of public sociology.\n\nGaining pr"}], "config": "A", "index": "A"}, {"id": "q15", "split": "dev", "type": "metadata_filter", "question": "What ethical concern did Max Weber identify for sociological research?", "expected_answer": "Personal values must not shape interpretation of results; sociologists must establish value neutrality.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [65], "evidence_quote": "Sociologists, he stated, must establish value neutrality, a practice of remaining impartial, without bias or judgment, during the course of a study and in publishing results", "filter": {"chapter": 2}, "filter_applied": null, "hit@1": false, "hit@3": true, "first_hit_rank": 2, "failure": null, "filter_compliant": false, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p065-fixed-003", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 65, "chapter": 2, "section": "2.3", "score": 0.825477, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "ct studies to shed light on human behaviors. Knowledge is a powerful tool that can be used to achieve positive change. As a result, conducting a sociological study comes with a tremendous amount of responsibility. Like all researchers, sociologists must consider their ethical obligation to avoid harming human subjects or groups while conducting research.\n\nPioneer German sociologist Max Weber (1864–1920) identified another crucial ethical concern. Weber understood that personal values could disto"}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p065-fixed-004", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 65, "chapter": 2, "section": "2.3", "score": 0.708612, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": " Weber understood that personal values could distort the framework for disclosing study results. While he accepted that some aspects of research design might be influenced by personal values, he declared it was entirely inappropriate to allow personal values to shape the interpretation of the responses. Sociologists, he stated, must establish value neutrality, a practice of remaining impartial, without bias or judgment, during the course of a study and in publishing results (Weber, 1949). Sociol"}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p026-fixed-003", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 26, "chapter": 1, "section": "1.2", "score": 0.630194, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "ividual or psychological causes.\n\nMax Weber (1864–1920)\n\nProminent sociologist Max Weber established a sociology department in Germany at the Ludwig Maximilians University of Munich in 1919. Weber wrote on many topics related to sociology including political change in Russia and social forces that affect factory workers. He is known best for his 1904 book, The Protestant Ethic and the Spirit of Capitalism. The theory that Weber sets forth in this book is still controversial. Some believe that We"}], "config": "A", "index": "A"}, {"id": "q01", "split": "dev", "type": "direct", "question": "What do sociologists call a group of people who live in a defined geographic area, interact with one another, and share a common culture?", "expected_answer": "A society.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [20], "evidence_quote": "A group of people who live in a defined geographic area, who interact with one another, and who share a common culture is what sociologists call a society.", "filter": null, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p020-para-003", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 20, "chapter": 1, "section": "1.1", "score": 0.795393, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "Sociology is the scientific and systematic study of groups and group interactions, societies and social interactions, from small and personal groups to very large groups. A group of people who live in a defined geographic area, who interact with one another, and who share a common culture is what sociologists call a society."}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p021-para-000", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 21, "chapter": 1, "section": "1.1", "score": 0.569087, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "The term culture refers to the group’s shared practices, values, and beliefs. Culture encompasses a group’s way of life, from routine, everyday interactions to the most important parts of group members’ lives. It includes everything produced by a society, including all the social rules."}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p021-para-002", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 21, "chapter": 1, "section": "1.1", "score": 0.522001, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "Remember, though, that culture is a product of the people in a society. Sociologists take care not to treat the concept of “culture” as though it were alive and real. The error of treating an abstract concept as though it has a real, material existence is known as reification (Sahn, 2013)."}], "config": "B", "index": "B"}, {"id": "q02", "split": "dev", "type": "paraphrase", "question": "What is the name for the mistake of treating an abstract idea such as culture as if it physically existed?", "expected_answer": "Reification.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [21], "evidence_quote": "The error of treating an abstract concept as though it has a real, material existence is known as reification", "filter": null, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p021-para-002", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 21, "chapter": 1, "section": "1.1", "score": 0.761956, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "Remember, though, that culture is a product of the people in a society. Sociologists take care not to treat the concept of “culture” as though it were alive and real. The error of treating an abstract concept as though it has a real, material existence is known as reification (Sahn, 2013)."}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p026-para-003", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 26, "chapter": 1, "section": "1.2", "score": 0.495282, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "Weber believed that it was difficult, if not impossible, to use standard scientific methods to accurately predict the behavior of groups as some sociologists hoped to do. Weber argued that the influence of culture on human behavior had to be taken into account. This even applied to the researchers themselves, who should be aware of how their own cultural biases could influence their research. To deal with this problem, Weber and Wilhelm Dilthey introduced the concept of verstehen, a German word that means to understand in a deep way. In seeking verstehen, outside observers of a social world—an entire culture or a small setting—attempt to understand it from an insider’s point of view."}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p021-para-001", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 21, "chapter": 1, "section": "1.1", "score": 0.486504, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "Sociologists often study culture using the sociological imagination, which pioneer sociologist C. Wright Mills described as an awareness of the relationship between a person’s behavior and experience and the wider culture that shaped the person’s choices and perceptions. It’s a way of seeing our own and other people’s behavior in relationship to history and social structure (1959). One illustration of this is a person’s decision to marry. In the United States, this choice is heavily influenced by individual feelings. However, the social acceptability of marriage relative to the person’s circumstances also plays a part."}], "config": "B", "index": "B"}, {"id": "q03", "split": "dev", "type": "direct", "question": "What term did Norbert Elias use for analyzing individuals and the society that shapes their behavior at the same time?", "expected_answer": "Figuration.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [22], "evidence_quote": "German sociologist Norbert Elias called the process of simultaneously analyzing the behavior of individuals and the society that shapes that behavior figuration.", "filter": null, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p022-para-001", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 22, "chapter": 1, "section": "1.1", "score": 0.708484, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "Studying Part and Whole: How Sociologists View Social Structures\n\nA key component of the sociological perspective is the idea that the individual and society are inseparable. It is impossible to study one without the other. German sociologist Norbert Elias called the process of simultaneously analyzing the behavior of individuals and the society that shapes that behavior figuration. Consider religion. While people experience religion in a distinctly individual manner, religion exists in a larger social context as a social institution. For instance, an individual’s religious practice may be influenced by what government dictates, holidays, teachers, places of worship, rituals, and so on. "}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p034-para-000", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 34, "chapter": 1, "section": "1.3", "score": 0.570798, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "to communicate their message.\n\nThe focus on the importance of symbols in building a society led sociologists like Erving Goffman (1922-1982) to develop a technique called dramaturgical analysis. Goffman used theater as an analogy for social interaction and recognized that people’s interactions showed patterns of cultural “scripts.” He argued that individuals were actors in a play. We switched roles, sometimes minute to minute—for example, from student or daughter to dog walker. Because it can be unclear what part a person may play in a given situation, he or she has to improvise his or her role as the situation unfolds (Goffman, 1958)."}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p022-para-002", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 22, "chapter": 1, "section": "1.1", "score": 0.569668, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "These influences underscore the important relationship between individual practices of religion and social pressures that influence that religious experience (Elias, 1978). In simpler terms, figuration means that as one analyzes the social institutions in a society, the individuals using that institution in any fashion need to be ‘figured’ in to the analysis."}], "config": "B", "index": "B"}, {"id": "q04", "split": "dev", "type": "condition_exception", "question": "Who first coined the term sociology, and was it Auguste Comte?", "expected_answer": "Emmanuel-Joseph Sieyès coined it in 1780 in an unpublished manuscript; Comte only reintroduced the term in 1838.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [24], "evidence_quote": "The term sociology was first coined in 1780 by the French essayist Emmanuel-Joseph Sieyès (1748–1836) in an unpublished manuscript (Fauré et al. 1999). In 1838, the term was reintroduced by Auguste Comte", "filter": null, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p024-para-002", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 24, "chapter": 1, "section": "1.2", "score": 0.782909, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "The term sociology was first coined in 1780 by the French essayist Emmanuel-Joseph Sieyès (1748–1836) in an unpublished manuscript (Fauré et al. 1999). In 1838, the term was reintroduced by Auguste Comte (1798–1857). Comte originally studied to be an engineer, but later became a pupil of social philosopher Claude Henri de Rouvroy Comte de Saint-Simon (1760–1825). They both thought that social scientists could study society using the same scientific methods utilized in natural sciences. Comte also believed in the potential of social scientists to work toward the betterment of society. He held that once scholars identified the laws that governed society, sociologists could address problems such as poor education and poverty (Abercrombie et al. 2000)."}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p024-para-001", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 24, "chapter": 1, "section": "1.2", "score": 0.550507, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "Creating a Discipline: European Theorists\n\nFIGURE 1.5 Early major European theorists. Top row, left to right: Auguste Comte, Harriet Martineau, and Herbert Spencer. Bottom row, left to right: Georg Simmel, Émile Durkheim, and Max Weber. (Credit: Wikimedia Commons; Julius Cornelius Schaarwächter/Public domain.)\n\nAuguste Comte (1798 – 1857)"}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p023-para-000", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 23, "chapter": 1, "section": "1.2", "score": 0.54517, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "FIGURE 1.4 People have been thinking like sociologists long before sociology became a distinct academic discipline: Plato and Aristotle, Confucius, Khaldun, Voltaire, and Mary Wollstonecraft set the stage for modern sociology. (Credit: A, B, C, and E Wikimedia Commons; D: publicdomainfiles.com.)"}], "config": "B", "index": "B"}, {"id": "q05", "split": "dev", "type": "direct", "question": "What was the first book to have the word sociology in its title, and who wrote it?", "expected_answer": "The Study of Sociology, published by Herbert Spencer in 1873.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [25], "evidence_quote": "In 1873, the English philosopher Herbert Spencer published The Study of Sociology, the first book with the term “sociology” in the title.", "filter": null, "filter_applied": null, "hit@1": false, "hit@3": true, "first_hit_rank": 2, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p024-para-002", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 24, "chapter": 1, "section": "1.2", "score": 0.673761, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "The term sociology was first coined in 1780 by the French essayist Emmanuel-Joseph Sieyès (1748–1836) in an unpublished manuscript (Fauré et al. 1999). In 1838, the term was reintroduced by Auguste Comte (1798–1857). Comte originally studied to be an engineer, but later became a pupil of social philosopher Claude Henri de Rouvroy Comte de Saint-Simon (1760–1825). They both thought that social scientists could study society using the same scientific methods utilized in natural sciences. Comte also believed in the potential of social scientists to work toward the betterment of society. He held that once scholars identified the laws that governed society, sociologists could address problems such as poor education and poverty (Abercrombie et al. 2000)."}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p025-para-005", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 25, "chapter": 1, "section": "1.2", "score": 0.623037, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "In 1873, the English philosopher Herbert Spencer published The Study of Sociology, the first book with the term “sociology” in the title. Spencer rejected much of Comte’s philosophy as well as Marx’s theory of class struggle and his support of communism. Instead, he favored a form of government that allowed market forces to control capitalism. His work influenced many early sociologists including Émile Durkheim (1858–1917). Spencer, using Charles Darwin’s work as a comparison said, “This survival of the fittest, which I have here sought to express in mechanical terms, is that which Mr. Darwin has called ‘natural selection,’ or the preservation of favoured races in the struggle for life.” "}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p026-para-000", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 26, "chapter": 1, "section": "1.2", "score": 0.571742, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "and analyzed the dynamics of two-person and three-person groups. His work also emphasized individual culture as the creative capacities of individuals (Ritzer and Goodman 2004).\n\nÉmile Durkheim (1858–1917)\n\nÉmile Durkheim helped establish sociology as a formal academic discipline by establishing the first European department of sociology at the University of Bordeaux in 1895 and by publishing his Rules of the Sociological Method in 1895. In Division of Labour in Society (1893), Durkheim further laid out his theory on how societies transformed from a primitive state into a capitalist, industrial society. According to Durkheim, people rise to their proper levels in society based on merit."}], "config": "B", "index": "B"}, {"id": "q06", "split": "dev", "type": "direct", "question": "Where and when did Émile Durkheim establish the first European department of sociology?", "expected_answer": "At the University of Bordeaux in 1895.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [26], "evidence_quote": "establishing the first European department of sociology at the University of Bordeaux in 1895", "filter": null, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p026-para-000", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 26, "chapter": 1, "section": "1.2", "score": 0.758289, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "and analyzed the dynamics of two-person and three-person groups. His work also emphasized individual culture as the creative capacities of individuals (Ritzer and Goodman 2004).\n\nÉmile Durkheim (1858–1917)\n\nÉmile Durkheim helped establish sociology as a formal academic discipline by establishing the first European department of sociology at the University of Bordeaux in 1895 and by publishing his Rules of the Sociological Method in 1895. In Division of Labour in Society (1893), Durkheim further laid out his theory on how societies transformed from a primitive state into a capitalist, industrial society. According to Durkheim, people rise to their proper levels in society based on merit."}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p027-para-003", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 27, "chapter": 1, "section": "1.2", "score": 0.571972, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "In the early 1900s, sociology reached universities in the United States. William Sumner held the first professorship in sociology (Yale University), Franklin Giddings was the first full professor of Sociology (Columbia University), and Albion Small wrote the first sociology textbook. Early American sociologists tested and applied the theories of the Europeans and became leaders in social research. Lester Ward (1841 – 1913) developed social research methods and argued for the use of the scientific method and quantitative data (Chapter 2) to show the effectiveness of policies. In order for sociology to gain respectability in American academia, social researchers understood that they must adopt empirical approaches.\n\nW.E.B. Du Bois (1868-1963)"}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p024-para-001", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 24, "chapter": 1, "section": "1.2", "score": 0.55719, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "Creating a Discipline: European Theorists\n\nFIGURE 1.5 Early major European theorists. Top row, left to right: Auguste Comte, Harriet Martineau, and Herbert Spencer. Bottom row, left to right: Georg Simmel, Émile Durkheim, and Max Weber. (Credit: Wikimedia Commons; Julius Cornelius Schaarwächter/Public domain.)\n\nAuguste Comte (1798 – 1857)"}], "config": "B", "index": "B"}, {"id": "q07", "split": "dev", "type": "paraphrase", "question": "Which sociologist said people judge themselves by how others react to them, and what did he call this idea?", "expected_answer": "Charles Horton Cooley; the looking-glass self.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [28], "evidence_quote": "Calling this idea ‘the looking-glass self,’ Cooley argued that we ‘see’ ourselves by the reactions of others with whom we interact.", "filter": null, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p028-para-004", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 28, "chapter": 1, "section": "1.2", "score": 0.694902, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "Charles Horton Cooley posited that individuals compare themselves to others in order to check themselves against social standards and remain part of the group. Calling this idea ‘the looking-glass self,’ Cooley argued that we ‘see’ ourselves by the reactions of others with whom we interact. If someone reacts positively to our behavior, theoretically we will continue that behavior. He wrote substantially on what he saw as the order of life in Human Nature and the Social Order (1902) followed by Social Organization in 1909. He was very concerned with the increasing individualism and competitiveness of US society, fearing it would disrupt families as primary groups lost their importance.\n\nGeorge Herbert Mead (1863–1931)"}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p028-para-005", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 28, "chapter": 1, "section": "1.2", "score": 0.661327, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "George Herbert Mead was a philosopher and sociologist whose work focused on the ways in which the mind and the self were developed as a result of social processes (Cronk, n.d.). He argued that how an individual comes to view himself or herself is based to a very large extent on interactions with others. Though Mead adopted Cooley’s concept of ‘looking-glasses,’ Mead felt that an individual’s reaction to a positive or negative reflection depended on who the ‘other’ was. Individuals that had the greatest impact on a person’s life were significant others while generalized others were the organized and generalized attitude of a social group. Mead often shares the title of father of symbolic interactionism with Cooley and Erving Goffman. Robert E. Park (1864-1944)"}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p034-para-000", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 34, "chapter": 1, "section": "1.3", "score": 0.541651, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "to communicate their message.\n\nThe focus on the importance of symbols in building a society led sociologists like Erving Goffman (1922-1982) to develop a technique called dramaturgical analysis. Goffman used theater as an analogy for social interaction and recognized that people’s interactions showed patterns of cultural “scripts.” He argued that individuals were actors in a play. We switched roles, sometimes minute to minute—for example, from student or daughter to dog walker. Because it can be unclear what part a person may play in a given situation, he or she has to improvise his or her role as the situation unfolds (Goffman, 1958)."}], "config": "B", "index": "B"}, {"id": "q08", "split": "dev", "type": "direct", "question": "According to Robert Merton, what is the difference between manifest and latent functions?", "expected_answer": "Manifest functions are sought or anticipated consequences of a social process; latent functions are unsought consequences.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [30], "evidence_quote": "Manifest functions are the consequences of a social process that are sought or anticipated, while latent functions are the unsought consequences of a social process.", "filter": null, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p030-para-005", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 30, "chapter": 1, "section": "1.3", "score": 0.790547, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "Another noted structural functionalist, Robert Merton (1910–2003), pointed out that social processes often have many functions. Manifest functions are the consequences of a social process that are sought or anticipated, while latent functions are the unsought consequences of a social process. A manifest function of a college education, for example, includes gaining knowledge, preparing for a career, and finding a good job that utilizes that education. Latent functions of your college years include meeting new people, participating in extracurricular activities, or even finding a spouse or partner. Another latent function of education is creating"}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p031-para-000", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 31, "chapter": 1, "section": "1.3", "score": 0.658, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "a hierarchy of employment based on the level of education attained. Latent functions can be beneficial, neutral, or harmful. Social processes that have undesirable consequences for the operation of society are called dysfunctions. In education, examples of dysfunction include getting bad grades, truancy, dropping out, not graduating, and not finding suitable employment."}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p030-para-003", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 30, "chapter": 1, "section": "1.3", "score": 0.535702, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "Alfred Radcliffe-Brown (1881–1955), a social anthropologist, defined the function of any recurrent activity as the part it played in social life as a whole, and therefore the contribution it makes to social stability and continuity (Radcliffe-Brown 1952). In a healthy society, all parts work together to maintain stability, a state called dynamic equilibrium by later sociologists such as Parsons (1961). Durkheim believed that individuals may make up society, but in order to study society, sociologists have to look beyond individuals to social facts. Each of these social facts serves one or more functions within a society. "}], "config": "B", "index": "B"}, {"id": "q09", "split": "dev", "type": "paraphrase", "question": "Which technique used theater as an analogy for social interaction, and who developed it?", "expected_answer": "Dramaturgical analysis, developed by Erving Goffman.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [34], "evidence_quote": "Erving Goffman (1922-1982) to develop a technique called dramaturgical analysis. Goffman used theater as an analogy for social interaction", "filter": null, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p034-para-000", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 34, "chapter": 1, "section": "1.3", "score": 0.747
