ree citations in seventeen days.", "openstax-intro-sociology-3e-p064-fixed-000", "64", "California State University at Los Angeles, had a theory about police prejudice. To test her theory, she conducted research. She chose fifteen students from three ethnic backgrounds: Black, White, and Hispanic. She chose students who routinely drove to and from campus along Los Angeles freeway routes, and who had had perfect driving records for longer than a year.\n\nNext, she placed a Black Panther bumper sticker on each car. That sticker, a representation of a social value, was the independent v", "openstax-intro-sociology-3e-p064-fixed-001", "64", "sentation of a social value, was the independent variable. In the 1970s, the Black Panthers were a revolutionary group actively fighting racism. Heussenstamm asked the students to follow their normal driving patterns. She wanted to see whether seeming support for the Black Panthers would change how these good drivers were treated by the police patrolling the highways. The dependent variable would be the number of traffic stops/citations.\n\nThe first arrest, for an incorrect lane change, was made ", "openstax-intro-sociology-3e-p064-fixed-002", "64", "st arrest, for an incorrect lane change, was made two hours after the experiment began. One participant was pulled over three times in three days. He quit the study. After seventeen days, the fifteen drivers had collected a total of thirty-three traffic citations. The research was halted. The funding to pay traffic fines had run out, and so had the enthusiasm of the participants (Heussenstamm, 1971).\n\nSecondary Data Analysis\n\nWhile sociologists often engage in original research studies, they als", "True", "2", "top3 (p64) có đủ 'after seventeen days ... thirty-three traffic citations'."], ["t03", "A", "Whose research did the Supreme Court cite in Brown vs. the Board of Education?", "Kenneth and Mamie Clark.", "openstax-intro-sociology-3e-p035-fixed-000", "35", "1.4 Why Study Sociology?\n\nLEARNING OBJECTIVES\n\nBy the end of this section, you should be able to:\n\n• Explain why it is worthwhile to study sociology.\n\n• Identify ways sociology is applied in the real world.\n\nFIGURE 1.9 The research of Kenneth and Mamie Clark helped the Supreme Court decide to end “separate but equal” racial segregation in schools in the United States. (Credit: University of Texas) When Elizabeth Eckford tried to enter Central High School in Little Rock, Arkansas, in September 19", "openstax-intro-sociology-3e-p035-fixed-002", "35", "t of momentous, not only for education, but for a number of other segregation and discrimination issues that have lasted into this decade. And in that momentous decision, the Supreme Court cited the research of the husband-and-wife team of social scientists, Kenneth and Mamie Clark, as evidence that segregation generates in minority students a feeling of inferiority. In the ‘doll test,’ for example, the Clarks showed children four dolls, two with white skin and yellow hair and two with brown ski", "openstax-intro-sociology-3e-p035-fixed-004", "35", "r became depressed. The Clarks’ research contributed to the Supreme Court’s conclusion that separate but equal was damaging to students, and that separate facilities are unequal.\n\nSociology and a Better Society\n\nSince it was first founded, many people interested in sociology have been driven by the scholarly desire to contribute knowledge to this field, while others have seen it as way not only to study society but also to improve it. Besides desegregation, sociology has played a crucial role in", "True", "2", "top1 (chú thích FIGURE 1.9) và top2 (p35) đều nêu Kenneth và Mamie Clark."], ["t04", "A", "Which study investigated whether people can get by on minimum-wage work?", "Barbara Ehrenreich's participant observation for her book Nickel and Dimed.", "openstax-intro-sociology-3e-p059-fixed-003", "59", "l chain employee. During her participant observation, she used only her income from those jobs to pay for food, clothing, transportation, and shelter.\n\nShe discovered the obvious, that it’s almost impossible to get by on minimum wage work. She also experienced and observed attitudes many middle and upper-class people never think about. She witnessed firsthand the treatment of working class employees. She saw the extreme measures people take to make ends meet and to survive. She described fellow ", "openstax-intro-sociology-3e-p027-fixed-001", "27", "t some job loss would be greatly offset by the positive effects on the standard of living of low-wage workers and reducing the income gap between the rich and poor.\n\nSociologists may consider the minimum wage issue from differing perspectives as well. How much of an impact would a minimum wage raise have for a single mother? Some might study the economic effects, such as her ability to pay bills and keep food on the table. Others might look at how reduced economic stress could improve family rel", "openstax-intro-sociology-3e-p059-fixed-002", "59", "red. Someone should do a study. To her surprise, her editor responded, Why don’t you do it?\n\nThat’s how Ehrenreich found herself joining the ranks of the working class. For several months, she left her comfortable home and lived and worked among people who lacked, for the most part, higher education and marketable job skills. Undercover, she applied for and worked minimum wage jobs as a waitress, a cleaning woman, a nursing home aide, and a retail chain employee. During her participant observati", "False", "1", "top3 nêu Ehrenreich làm participant observation với việc lương tối thiểu, nhưng thiếu tên sách Nickel and Dimed; top2 lẫn chương 1."], ["t05", "A", "How does qualitative sociology seek to understand human behavior?", "Through in-depth interviews, focus groups, and analysis of content sources.", "openstax-intro-sociology-3e-p026-fixed-008", "26", "ology uses statistical methods such as surveys with large numbers of participants. Researchers analyze data using statistical techniques to see if they can uncover patterns of human behavior. Qualitative sociology seeks to understand human behavior by learning about it through in-depth interviews, focus groups, and analysis of content sources (like books, magazines, journals, and popular media).", "openstax-intro-sociology-3e-p026-fixed-007", "26", "rocesses, cultural norms, and societal values. This approach led to some research methods whose aim was not to generalize or predict (traditional in science), but to systematically gain an in-depth understanding of social worlds.\n\nThe different approaches to research based on positivism or anti-positivism are often considered the foundation for the differences found today between quantitative sociology and qualitative sociology. Quantitative sociology uses statistical methods such as surveys wit", "openstax-intro-sociology-3e-p048-fixed-001", "48", "arch study.\n\nWhen sociologists apply the sociological perspective and begin to ask questions, no topic is off limits. Every aspect of human behavior is a source of possible investigation. Sociologists question the world that humans have created and live in. They notice patterns of behavior as people move through that world. Using sociological methods and systematic research within the framework of the scientific method and a scholarly interpretive perspective, sociologists have discovered social", "True", "2", "top1 (p26) có nguyên câu về qualitative sociology."], ["t01", "B", "Case studies are rarely a primary method, but in what situation are they especially useful?", "When the single case is unique, e.g. a feral child.", "openstax-intro-sociology-3e-p062-para-001", "62", "Researchers might use this method to study a single case of a foster child, drug lord, cancer patient, criminal, or rape victim. However, a major criticism of the case study as a method is that while offering depth on a topic, it does not provide enough evidence to form a generalized conclusion. In other words, it is difficult to make universal claims based on just one person, since one person does not verify a pattern. This is why most sociologists do not use case studies as a primary research method.", "openstax-intro-sociology-3e-p052-para-006", "52", "Sociologists examine the social world, see a problem or interesting pattern, and set out to study it. They use research methods to design a study. Planning the research design is a key step in any sociological study. Sociologists generally choose from widely used methods of social investigation: primary source data collection such as survey, participant observation, ethnography, case study, unobtrusive observations, experiment, and secondary data analysis, or use of existing sources. Every research method comes with plusses and minuses, and the topic of study strongly influences which method or methods are put to use. When you are conducting research think about the best way to gather or obtain knowledge about your topic, think of yourself as an architect. ", "openstax-intro-sociology-3e-p062-para-000", "62", "FIGURE 2.9 A classroom in Muncie, Indiana, in 1917, five years before John and Helen Lynd began researching this “typical” U.S. community. (Credit: Don O’Brien/flickr)\n\nCase Study\n\nSometimes a researcher wants to study one specific person or event. A case study is an in-depth analysis of a single event, situation, or individual. To conduct a case study, a researcher examines existing sources like documents and archival records, conducts interviews, engages in direct observation and even participant observation, if possible.", "False", "0", "Top-3 chỉ nói case study ít được dùng và định nghĩa case study; không có câu trả lời 'khi trường hợp là duy nhất'."], ["t02", "B", "In the bumper sticker experiment on police treatment of drivers, how many citations did the drivers get and over how many days?", "Thirty-three citations in seventeen days.", "openstax-intro-sociology-3e-p064-para-001", "64", "Next, she placed a Black Panther bumper sticker on each car. That sticker, a representation of a social value, was the independent variable. In the 1970s, the Black Panthers were a revolutionary group actively fighting racism. Heussenstamm asked the students to follow their normal driving patterns. She wanted to see whether seeming support for the Black Panthers would change how these good drivers were treated by the police patrolling the highways. The dependent variable would be the number of traffic stops/citations.", "openstax-intro-sociology-3e-p064-para-002", "64", "The first arrest, for an incorrect lane change, was made two hours after the experiment began. One participant was pulled over three times in three days. He quit the study. After seventeen days, the fifteen drivers had collected a total of thirty-three traffic citations. The research was halted. The funding to pay traffic fines had run out, and so had the enthusiasm of the participants (Heussenstamm, 1971).", "openstax-intro-sociology-3e-p064-para-000", "64", "California State University at Los Angeles, had a theory about police prejudice. To test her theory, she conducted research. She chose fifteen students from three ethnic backgrounds: Black, White, and Hispanic. She chose students who routinely drove to and from campus along Los Angeles freeway routes, and who had had perfect driving records for longer than a year.", "True", "2", "top2 (p64) có đủ 33 citations / 17 days."], ["t03", "B", "Whose research did the Supreme Court cite in Brown vs. the Board of Education?", "Kenneth and Mamie Clark.", "openstax-intro-sociology-3e-p035-para-001", "35", "FIGURE 1.9 The research of Kenneth and Mamie Clark helped the Supreme Court decide to end “separate but equal” racial segregation in schools in the United States. (Credit: University of Texas) When Elizabeth Eckford tried to enter Central High School in Little Rock, Arkansas, in September 1957, she was met by an angry crowd and was turned away by authorities. But she knew she had the law on her side. Three years earlier in the landmark Brown vs. the Board of Education decision, the U.S. Supreme Court had overturned twenty-one state laws that allowed Black and White people to be taught in separate school systems as long as the school systems were “equal.” ", "openstax-intro-sociology-3e-p035-para-002", "35", "The decision was nothing short of momentous, not only for education, but for a number of other segregation and discrimination issues that have lasted into this decade. And in that momentous decision, the Supreme Court cited the research of the husband-and-wife team of social scientists, Kenneth and Mamie Clark, as evidence that segregation generates in minority students a feeling of inferiority. In the ‘doll test,’ for example, the Clarks showed children four dolls, two with white skin and yellow hair and two with brown skin and black hair. When asked which doll they preferred, the majority of Black children chose the doll with the light skin doll, and they assigned positive characteristics to it. ", "openstax-intro-sociology-3e-p035-para-003", "35", "Most of the Black children discarded the doll with the brown skin—the one that had a closer resemblance to themselves. When asked to choose the doll that looked like them, many children left the room, started to cry, and/or became depressed. The Clarks’ research contributed to the Supreme Court’s conclusion that separate but equal was damaging to students, and that separate facilities are unequal.", "True", "2", "top1 chú thích FIGURE 1.9 đã đủ trả lời; top2 có câu evidence gốc (p35)."], ["t04", "B", "Which study investigated whether people can get by on minimum-wage work?", "Barbara Ehrenreich's participant observation for her book Nickel and Dimed.", "openstax-intro-sociology-3e-p059-para-001", "59", "This type of research is what journalist Barbara Ehrenreich conducted for her book Nickel and Dimed. One day over lunch with her editor, Ehrenreich mentioned an idea. How can people exist on minimum-wage work? How do low-income workers get by? she wondered. Someone should do a study. To her surprise, her editor responded, Why don’t you do it?", "openstax-intro-sociology-3e-p059-para-002", "59", "That’s how Ehrenreich found herself joining the ranks of the working class. For several months, she left her comfortable home and lived and worked among people who lacked, for the most part, higher education and marketable job skills. Undercover, she applied for and worked minimum wage jobs as a waitress, a cleaning woman, a nursing home aide, and a retail chain employee. During her participant observation, she used only her income from those jobs to pay for food, clothing, transportation, and shelter.", "openstax-intro-sociology-3e-p059-para-003", "59", "She discovered the obvious, that it’s almost impossible to get by on minimum wage work. She also experienced and observed attitudes many middle and upper-class people never think about. She witnessed firsthand the treatment of working class employees. She saw the extreme measures people take to make ends meet and to survive. She described fellow employees who held two or three jobs, worked seven days a week, lived in cars, could not pay to treat chronic health conditions, got randomly fired, submitted to drug tests, and moved in and out of homeless shelters. She brought aspects of that life to light, describing difficult working conditions and the poor treatment that low-wage workers suffer.", "True", "2", "top1 (p59) nêu đủ Ehrenreich + Nickel and Dimed + câu hỏi về lương tối thiểu."], ["t05", "B", "How does qualitative sociology seek to understand human behavior?", "Through in-depth interviews, focus groups, and analysis of content sources.", "openstax-intro-sociology-3e-p026-para-005", "26", "The different approaches to research based on positivism or anti-positivism are often considered the foundation for the differences found today between quantitative sociology and qualitative sociology. Quantitative sociology uses statistical methods such as surveys with large numbers of participants. Researchers analyze data using statistical techniques to see if they can uncover patterns of human behavior. Qualitative sociology seeks to understand human behavior by learning about it through in-depth interviews, focus groups, and analysis of content sources (like books, magazines, journals, and popular media).", "openstax-intro-sociology-3e-p034-para-001", "34", "Studies that use the symbolic interactionist perspective are more likely to use qualitative research methods, such as in-depth interviews or participant observation, because they seek to understand the symbolic worlds in which research subjects live.", "openstax-intro-sociology-3e-p026-para-004", "26", "In The Nature of Social Action, Weber described sociology as striving to “... interpret the meaning of social action and thereby give a causal explanation of the way in which action proceeds and the effects it produces.” He and other like-minded sociologists proposed a philosophy of anti-positivism whereby social researchers would strive for subjectivity as they worked to represent social processes, cultural norms, and societal values. This approach led to some research methods whose aim was not to generalize or predict (traditional in science), but to systematically gain an in-depth understanding of social worlds.", "True", "2", "top1 (p26) có nguyên câu về qualitative sociology."], ["t01", "C", "Case studies are rarely a primary method, but in what situation are they especially useful?", "When the single case is unique, e.g. a feral child.", "openstax-intro-sociology-3e-p062-para-001", "62", "Researchers might use this method to study a single case of a foster child, drug lord, cancer patient, criminal, or rape victim. However, a major criticism of the case study as a method is that while offering depth on a topic, it does not provide enough evidence to form a generalized conclusion. In other words, it is difficult to make universal claims based on just one person, since one person does not verify a pattern. This is why most sociologists do not use case studies as a primary research method.", "openstax-intro-sociology-3e-p052-para-006", "52", "Sociologists examine the social world, see a problem or interesting pattern, and set out to study it. They use research methods to design a study. Planning the research design is a key step in any sociological study. Sociologists generally choose from widely used methods of social investigation: primary source data collection such as survey, participant observation, ethnography, case study, unobtrusive observations, experiment, and secondary data analysis, or use of existing sources. Every research method comes with plusses and minuses, and the topic of study strongly influences which method or methods are put to use. When you are conducting research think about the best way to gather or obtain knowledge about your topic, think of yourself as an architect. ", "openstax-intro-sociology-3e-p062-para-000", "62", "FIGURE 2.9 A classroom in Muncie, Indiana, in 1917, five years before John and Helen Lynd began researching this “typical” U.S. community. (Credit: Don O’Brien/flickr)\n\nCase Study\n\nSometimes a researcher wants to study one specific person or event. A case study is an in-depth analysis of a single event, situation, or individual. To conduct a case study, a researcher examines existing sources like documents and archival records, conducts interviews, engages in direct observation and even participant observation, if possible.", "False", "0", "Giống B (không có filter): không có bằng chứng cho đáp án."], ["t02", "C", "In the bumper sticker experiment on police treatment of drivers, how many citations did the drivers get and over how many days?", "Thirty-three citations in seventeen days.", "openstax-intro-sociology-3e-p064-para-001", "64", "Next, she placed a Black Panther bumper sticker on each car. That sticker, a representation of a social value, was the independent variable. In the 1970s, the Black Panthers were a revolutionary group actively fighting racism. Heussenstamm asked the students to follow their normal driving patterns. She wanted to see whether seeming support for the Black Panthers would change how these good drivers were treated by the police patrolling the highways. The dependent variable would be the number of traffic stops/citations.", "openstax-intro-sociology-3e-p064-para-002", "64", "The first arrest, for an incorrect lane change, was made two hours after the experiment began. One participant was pulled over three times in three days. He quit the study. After seventeen days, the fifteen drivers had collected a total of thirty-three traffic citations. The research was halted. The funding to pay traffic fines had run out, and so had the enthusiasm of the participants (Heussenstamm, 1971).", "openstax-intro-sociology-3e-p064-para-000", "64", "California State University at Los Angeles, had a theory about police prejudice. To test her theory, she conducted research. She chose fifteen students from three ethnic backgrounds: Black, White, and Hispanic. She chose students who routinely drove to and from campus along Los Angeles freeway routes, and who had had perfect driving records for longer than a year.", "True", "2", "Giống B: top2 (p64) có đủ 33 citations / 17 days."], ["t03", "C", "Whose research did the Supreme Court cite in Brown vs. the Board of Education?", "Kenneth and Mamie Clark.", "openstax-intro-sociology-3e-p035-para-001", "35", "FIGURE 1.9 The research of Kenneth and Mamie Clark helped the Supreme Court decide to end “separate but equal” racial segregation in schools in the United States. (Credit: University of Texas) When Elizabeth Eckford tried to enter Central High School in Little Rock, Arkansas, in September 1957, she was met by an angry crowd and was turned away by authorities. But she knew she had the law on her side. Three years earlier in the landmark Brown vs. the Board of Education decision, the U.S. Supreme Court had overturned twenty-one state laws that allowed Black and White people to be taught in separate school systems as long as the school systems were “equal.” ", "openstax-intro-sociology-3e-p035-para-002", "35", "The decision was nothing short of momentous, not only for education, but for a number of other segregation and discrimination issues that have lasted into this decade. And in that momentous decision, the Supreme Court cited the research of the husband-and-wife team of social scientists, Kenneth and Mamie Clark, as evidence that segregation generates in minority students a feeling of inferiority. In the ‘doll test,’ for example, the Clarks showed children four dolls, two with white skin and yellow hair and two with brown skin and black hair. When asked which doll they preferred, the majority of Black children chose the doll with the light skin doll, and they assigned positive characteristics to it. ", "openstax-intro-sociology-3e-p035-para-003", "35", "Most of the Black children discarded the doll with the brown skin—the one that had a closer resemblance to themselves. When asked to choose the doll that looked like them, many children left the room, started to cry, and/or became depressed. The Clarks’ research contributed to the Supreme Court’s conclusion that separate but equal was damaging to students, and that separate facilities are unequal.", "True", "2", "Giống B: đủ bằng chứng trên p35."], ["t04", "C", "Which study investigated whether people can get by on minimum-wage work?", "Barbara Ehrenreich's participant observation for her book Nickel and Dimed.", "openstax-intro-sociology-3e-p059-para-001", "59", "This type of research is what journalist Barbara Ehrenreich conducted for her book Nickel and Dimed. One day over lunch with her editor, Ehrenreich mentioned an idea. How can people exist on minimum-wage work? How do low-income workers get by? she wondered. Someone should do a study. To her surprise, her editor responded, Why don’t you do it?", "openstax-intro-sociology-3e-p059-para-002", "59", "That’s how Ehrenreich found herself joining the ranks of the working class. For several months, she left her comfortable home and lived and worked among people who lacked, for the most part, higher education and marketable job skills. Undercover, she applied for and worked minimum wage jobs as a waitress, a cleaning woman, a nursing home aide, and a retail chain employee. During her participant observation, she used only her income from those jobs to pay for food, clothing, transportation, and shelter.", "openstax-intro-sociology-3e-p059-para-003", "59", "She discovered the obvious, that it’s almost impossible to get by on minimum wage work. She also experienced and observed attitudes many middle and upper-class people never think about. She witnessed firsthand the treatment of working class employees. She saw the extreme measures people take to make ends meet and to survive. She described fellow employees who held two or three jobs, worked seven days a week, lived in cars, could not pay to treat chronic health conditions, got randomly fired, submitted to drug tests, and moved in and out of homeless shelters. She brought aspects of that life to light, describing difficult working conditions and the poor treatment that low-wage workers suffer.", "True", "2", "Filter chapter 2; top1 (p59) đủ Ehrenreich + Nickel and Dimed."], ["t05", "C", "How does qualitative sociology seek to understand human behavior?", "Through in-depth interviews, focus groups, and analysis of content sources.", "openstax-intro-sociology-3e-p026-para-005", "26", "The different approaches to research based on positivism or anti-positivism are often considered the foundation for the differences found today between quantitative sociology and qualitative sociology. Quantitative sociology uses statistical methods such as surveys with large numbers of participants. Researchers analyze data using statistical techniques to see if they can uncover patterns of human behavior. Qualitative sociology seeks to understand human behavior by learning about it through in-depth interviews, focus groups, and analysis of content sources (like books, magazines, journals, and popular media).", "openstax-intro-sociology-3e-p034-para-001", "34", "Studies that use the symbolic interactionist perspective are more likely to use qualitative research methods, such as in-depth interviews or participant observation, because they seek to understand the symbolic worlds in which research subjects live.", "openstax-intro-sociology-3e-p026-para-004", "26", "In The Nature of Social Action, Weber described sociology as striving to “... interpret the meaning of social action and thereby give a causal explanation of the way in which action proceeds and the effects it produces.” He and other like-minded sociologists proposed a philosophy of anti-positivism whereby social researchers would strive for subjectivity as they worked to represent social processes, cultural norms, and societal values. This approach led to some research methods whose aim was not to generalize or predict (traditional in science), but to systematically gain an in-depth understanding of social worlds.", "True", "2", "Filter chapter 1; top1 (p26) có nguyên câu evidence."]]}}, "experiment": [{"strategy": "A", "chunking": "fixed_size (char windows per page)", "chunk_size": "500", "overlap": "50", "metadata": "document_id, source, page, chapter, section", "filter": "none", "vectorizer": "openrouter qwen/qwen3-embedding-8b (4096d)", "hypothesis": "", "dev_hit1": "13/15", "dev_hit3": "15/15", "test_hit1": "2/5", "test_hit3": "4/5", "notes": "Selection criterion fixed 2026-11-13 before any test run: highest dev Evidence Hit@3; tie -> highest dev Hit@1; tie -> fewer chunks / lower cost. Tie-break step 4 added 2026-11-13 after dev, before test: higher dev filter compliance. Chosen: C (dev filter compliance 2/2 vs B 0/2)."}, {"strategy": "B", "chunking": "by_paragraph (per page; heading kept with next paragraph)", "chunk_size": "800 max", "overlap": "0", "metadata": "document_id, source, page, chapter, section", "filter": "none", "vectorizer": "openrouter qwen/qwen3-embedding-8b (4096d)", "hypothesis": "chunk theo đoạn giữ trọn ý nên Hit@1 cao hơn A", "dev_hit1": "14/15", "dev_hit3": "15/15", "test_hit1": "2/5", "test_hit3": "4/5", "notes": "Same criterion as A."}, {"strategy": "C", "chunking": "same chunks/vectors as B", "chunk_size": "800 max", "overlap": "0", "metadata": "document_id, source, page, chapter, section", "filter": "chapter (only for questions with filter)", "vectorizer": "openrouter qwen/qwen3-embedding-8b (4096d)", "hypothesis": "filter loại chunk chương khác ở câu có phạm vi", "dev_hit1": "14/15", "dev_hit3": "15/15", "test_hit1": "2/5", "test_hit3": "4/5", "notes": "Same criterion as A. B vs C differs only by the metadata filter."}], "sample": {"page": 20, "raw": "And then the customs develop: Which side to walk on, how fast to go, where to stand, how much space to leave \nbetween people on the escalator. When you board early, which seat should you take? When you see someone \nrunning for the train, do you jam the closing door with your foot? How does the crowd treat people who ask for \nfood or money? What’s the risk level in telling someone to be quiet? \nVery few of these behaviors are taught. None are written down. But the transit hub, that pocket of constant flow, \nis an echo of its society. It takes on some aspects of the city and country around it, but its people also form an \ninformal group of their own. Sociologists, as you will learn, may study these people. Sociologists may seek to \nunderstand how they feel about their trip, be it proud or annoyed or just plain exhausted. Sociologists might \nstudy how length of commute relates to job satisfaction or family relationships. They may study the ways that \nconditions of a train station affect attitudes about government, or how the difficulty of commuting may lead \npeople to relocate. This understanding isn’t just a collection of interesting facts; it can influence government \npolicy and spending decisions, employer interventions, and healthcare practices. The work sociologists do to \nunderstand our society, and the work you will do in learning about it, is meaningful to our lives and our \nfutures. \n1.1 What Is Sociology? \nLEARNING OBJECTIVES \nBy the end of this section, you should be able to: \n• Explain concepts central to sociology. \n• Describe how different sociological perspectives have developed. \nWhat Are Society and Culture? \nFIGURE 1.2 Sociologists learn about society while studying one-to-one and group interactions. (Credit: GlacierNPS/\nFlickr) \nSociology is the scientific and systematic study of groups and group interactions, societies and social \ninteractions, from small and personal groups to very large groups. A group of people who live in a defined \ngeographic area, who interact with one another, and who share a common culture is what sociologists call a \nsociety. \nSociologists study all aspects and levels of society. Sociologists working from the micro-level study small \ngroups and individual interactions, while those using macro-level analysis look at trends among and between \nlarge groups and societies. For example, a micro-level study might look at the accepted rules of conversation in \nvarious groups such as among teenagers or business professionals. In contrast, a macro-level analysis might \nresearch the ways that language use has changed over time or in social media outlets. \n8     1 • An Introduction to Sociology\nAccess for free at openstax.org", "normalized": "And then the customs develop: Which side to walk on, how fast to go, where to stand, how much space to leave between people on the escalator. When you board early, which seat should you take? When you see someone running for the train, do you jam the closing door with your foot? How does the crowd treat people who ask for food or money? What’s the risk level in telling someone to be quiet?\n\nVery few of these behaviors are taught. None are written down. But the transit hub, that pocket of constant flow, is an echo of its society. It takes on some aspects of the city and country around it, but its people also form an informal group of their own. Sociologists, as you will learn, may study these people. Sociologists may seek to understand how they feel about their trip, be it proud or annoyed or just plain exhausted. Sociologists might study how length of commute relates to job satisfaction or family relationships. They may study the ways that conditions of a train station affect attitudes about government, or how the difficulty of commuting may lead people to relocate. This understanding isn’t just a collection of interesting facts; it can influence government policy and spending decisions, employer interventions, and healthcare practices. The work sociologists do to understand our society, and the work you will do in learning about it, is meaningful to our lives and our futures.\n\n1.1 What Is Sociology?\n\nLEARNING OBJECTIVES\n\nBy the end of this section, you should be able to:\n\n• Explain concepts central to sociology.\n\n• Describe how different sociological perspectives have developed.\n\nWhat Are Society and Culture?\n\nFIGURE 1.2 Sociologists learn about society while studying one-to-one and group interactions. (Credit: GlacierNPS/ Flickr)\n\nSociology is the scientific and systematic study of groups and group interactions, societies and social interactions, from small and personal groups to very large groups. A group of people who live in a defined geographic area, who interact with one another, and who share a common culture is what sociologists call a society.\n\nSociologists study all aspects and levels of society. Sociologists working from the micro-level study small groups and individual interactions, while those using macro-level analysis look at trends among and between large groups and societies. For example, a micro-level study might look at the accepted rules of conversation in various groups such as among teenagers or business professionals. In contrast, a macro-level analysis might research the ways that language use has changed over time or in social media outlets."}}</script>
  <script>
    "use strict";
    const D = JSON.parse(document.getElementById("lab-data").textContent);

    /* ---------- helpers ---------- */
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const fmtInt = (n) => Number(n).toLocaleString("vi-VN");
    const fmtDec = (n, d = 1) => Number(n).toLocaleString("vi-VN", { minimumFractionDigits: d, maximumFractionDigits: d });
    const CONFIGS = ["A", "B", "C"];
    const CFG_NAME = { A: "Cắt cố định 500", B: "Theo đoạn ≤ 800", C: "B + lọc chương" };
    const ICON = {
      ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
      bad: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
      part: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>',
      go: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
      table: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 10h17M9.5 10v9.5"/></svg>',
      close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    };
    const tag = (kind, text, icon) => `<span class="tag ${kind}">${icon ? ICON[icon] : ""}${esc(text)}</span>`;
    const ratio = (r) => (r === "N/A" ? "N/A" : `${r.n}/${r.N}`);
    const cfgBadge = (c) => `<span class="cfg ${c}" aria-hidden="true">${c}</span>`;
    const csvRows = (name) => {
      const { header, rows } = D.audits[name];
      return rows.map((r) => Object.fromEntries(header.map((h, i) => [h, r[i]])));
    };

    /* Evidence highlighting: whitespace-insensitive match of the quote inside chunk text. */
    const wsPattern = (s) => s.trim().split(/\s+/).map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("\\s+");
    function highlight(text, quote, edge = 30) {
      const tryMark = (q, cls) => {
        const m = new RegExp(wsPattern(q)).exec(text);
        return m ? { start: m.index, end: m.index + m[0].length, cls } : null;
      };
      const norm = quote.replace(/\s+/g, " ").trim();
      const hit = tryMark(norm, "") || tryMark(norm.slice(0, edge), "partial") || tryMark(norm.slice(-edge), "partial");
      if (!hit) return esc(text);
      return esc(text.slice(0, hit.start)) + `<mark class="${hit.cls}">` + esc(text.slice(hit.start, hit.end)) + "</mark>" + esc(text.slice(hit.end));
    }

    /* ---------- derived numbers (never typed by hand) ---------- */
    const S = D.source;
    const LOG = D.ingestion;
    const RUN1 = D.index_runs[0];
    const RUN2 = D.index_runs[D.index_runs.length - 1];
    const tokensTotal = RUN1.total_usage.prompt_tokens;
    const costTotal = RUN1.total_usage.cost;
    const chapters = S.selected_scope;
    const chapterOf = (p) => (chapters.find((c) => c.pdf_pages.includes(p)) || {}).chapter;
    const Q = Object.fromEntries(D.questions.map((q) => [q.id, q]));
    const TRACE = {};
    for (const split of ["dev", "test"]) for (const t of D.traces[split]) (TRACE[t.id] ??= {})[t.config] = t;
    const chosen = "C";
    const TYPE_VI = { direct: "Trực tiếp", paraphrase: "Diễn đạt lại", condition_exception: "Điều kiện / ngoại lệ", metadata_filter: "Cần lọc metadata" };

    /* ---------- slides ---------- */
    const slides = [];

    slides.push({
      title: "Mở đầu", cls: "title-slide", html: () => {
        const st = D.student;
        const who = [st.name && `<span><b>${esc(st.name)}</b></span>`, st.id && `<span>MSSV <b class="num">${esc(st.id)}</b></span>`, st.class && `<span>Lớp <b>${esc(st.class)}</b></span>`].filter(Boolean).join("");
        return `<div class="ruled" aria-hidden="true"></div><div class="margin" aria-hidden="true"></div>
  <p class="hint"><kbd>←</kbd><kbd>→</kbd> chuyển slide · <kbd>F</kbd> toàn màn hình</p>
  <h1>Biến một cuốn sách thành kho tri thức truy xuất được</h1>
  <p class="sub">Day 06 · Data Ingestion Engineering — so sánh ba cách chuẩn bị dữ liệu trên <i>${esc(S.title)}</i>, đo bằng ${D.questions.length} câu hỏi có bằng chứng.</p>
  <div class="who">${who || '<span class="muted">Điền họ tên, MSSV vào STUDENT.md rồi build lại</span>'}</div>`;
      }
    });

    slides.push({
      title: "Corpus", html: () => {
        const cells = [];
        const sets = Object.fromEntries(chapters.map((c) => [c.chapter, new Set(c.pdf_pages)]));
        const ends = new Set();
        for (const ex of S.excluded_pages) {
          if (!/end matter/.test(ex.reason)) continue;
          const [a, b] = String(ex.pdf_pages).split("-").map(Number);
          for (let p = a; p <= b; p++) ends.add(p);
        }
        for (let p = 1; p <= 80; p++) {
          const cls = sets[1]?.has(p) ? "c1" : sets[2]?.has(p) ? "c2" : ends.has(p) ? "end" : "";
          cells.push(`<i class="${cls}" title="Trang ${p}"></i>`);
        }
        const axis = Array.from({ length: 80 }, (_, i) => `<span>${(i + 1) % 10 === 1 ? i + 1 : ""}</span>`).join("");
        const ch = chapters.map((c) => `<dt>Chương ${c.chapter}</dt><dd>${esc(c.title)} — trang <span class="num">${c.pdf_pages[0]}–${c.pdf_pages[c.pdf_pages.length - 1]}</span> (${c.page_count} trang)</dd>`).join("");
        return `<h2>Corpus: ${S.counted_content_pages} trang nội dung, có quyền sử dụng</h2>
  <p class="lede">Hai chương đầu của sách giáo khoa mở OpenStax. Chọn sách vì có cấu trúc chương/mục rõ ràng và nhiều khái niệm lặp lại giữa hai chương — đủ để thử bộ lọc metadata.</p>
  <div class="strip" role="img" aria-label="80 trang PDF đầu tiên: trang ${chapters.map((c) => c.pdf_pages[0] + "–" + c.pdf_pages.at(-1)).join(" và ")} được dùng">${cells.join("")}</div>
  <div class="strip-axis" aria-hidden="true">${axis}</div>
  <div class="legend">
    <span><i style="background:var(--cfg-b)"></i>Chương 1 — dùng</span>
    <span><i style="background:var(--accent)"></i>Chương 2 — dùng</span>
    <span><i style="background:repeating-linear-gradient(135deg,var(--rule) 0 3px,var(--paper-2) 3px 7px)"></i>Cuối chương: quiz, tóm tắt, tham khảo — loại</span>
    <span><i style="background:var(--paper-2);border:1px solid var(--rule)"></i>Bìa, mục lục, lời nói đầu — loại</span>
  </div>
  <div class="row rule-top" style="margin-top:34px">
    <dl class="facts grow">${ch}<dt>Quy tắc đếm</dt><dd>Trang PDF vật lý (đếm từ 1) có nội dung chính.</dd></dl>
    <dl class="facts grow"><dt>Nguồn</dt><dd>${esc(S.publisher)} · ${esc(S.title)}</dd><dt>Giấy phép</dt><dd>CC BY-NC-SA 4.0 — phi thương mại, ghi công, chia sẻ cùng giấy phép</dd><dt>Toàn sách</dt><dd><span class="num">${fmtInt(S.physical_pages_total)}</span> trang PDF · truy cập ${esc(S.accessed_at)}</dd></dl>
  </div>`;
      }
    });

    slides.push({
      title: "Pipeline", html: () => {
        const A = LOG.strategy_A, B = LOG.strategy_B, meta = D.run_meta.dev;
        const steps = [
          ["Đọc PDF", LOG.content_pages, `trang có text / ${LOG.page_count} · rỗng ${LOG.empty_pages.length} · lỗi ${LOG.error_pages.length}`, "pypdf"],
          ["Chuẩn hóa", fmtInt(LOG.total_chars), "ký tự sau khi làm sạch", "NFKC · bỏ header/footer · dựng đoạn"],
          ["Chia chunk", `${A.count} · ${B.count}`, "chunk của A · B", "cố định 500/50 · theo đoạn ≤ 800"],
          ["Embedding", fmtInt(meta.dimensions), "chiều mỗi vector", esc(meta.model)],
          ["Lưu & tìm", fmtInt(A.count + B.count), "vector trong pgvector", "cosine, exact search"],
          ["Đánh giá", `${D.questions.length} × 3`, "câu hỏi × cấu hình", "Hit@1 · Hit@3 · chấm tay"],
        ];
        return `<h2>Pipeline từ PDF đến kết quả đo</h2>
  <p class="lede">Mọi con số dưới đây đọc trực tiếp từ log của lần chạy thật, không gõ tay.</p>
  <ol class="flow">${steps.map(([s, v, u, t]) => `<li><div class="step">${s}</div><div class="val num">${v}</div><div class="unit">${u}</div><div class="tool">${t}</div></li>`).join("")}</ol>
  <div class="row" style="margin-top:auto;gap:28px">
    <div class="callout grow">Embedding cả hai index: <b class="num">${fmtInt(tokensTotal)}</b> token, <b class="num">${costTotal.toFixed(6)}</b> credit OpenRouter. Chạy lại lần 2: <b class="num">${RUN2.strategies.A.embedded + RUN2.strategies.B.embedded}</b> chunk phải embed lại — nạp lại không trùng, không tốn thêm.</div>
    <div class="callout grow">Câu hỏi có instruction riêng, tài liệu thì không (theo model card Qwen3). Không có index HNSW vì pgvector chỉ index tới 2000 chiều; với ${fmtInt(A.count + B.count)} vector, tìm chính xác mất khoảng <b class="num">${Math.round(meta.search_ms_per_query.B)}</b> ms/câu.</div>
  </div>`;
      }
    });

    slides.push({
      title: "Chuẩn hóa", html: () => {
        const footer = [/^\d+\s+\d+ • .+$/, /^\d+\.\d+ • .+\s+\d+$/, /^Access for free at openstax\.org$/];
        const rawLines = D.sample.raw.split("\n").map((l) => l.replace(/\s+$/, ""));
        const SHOW = 8;
        const tail = rawLines.slice(-SHOW);
        const raw = tail.map((l) => {
          const t = l.trim();
          if (footer.some((re) => re.test(t))) return `<span class="drop">${esc(l)}</span>`;
          return esc(l) + `<span class="join" aria-hidden="true">⏎</span>`;
        }).join("\n");
        const paras = D.sample.normalized.split("\n\n");
        const lastParas = paras.slice(-3).map((p) => `<p>${esc(p)}</p>`).join("");
        return `<h2>Chuẩn hóa: từ dòng vỡ thành đoạn văn</h2>
  <p class="lede">pypdf trả về các dòng ngắt cứng, không có dòng trống giữa các đoạn, lẫn cả chân trang. Đây là trang ${D.sample.page}, trước và sau.</p>
  <div class="row grow" style="min-height:0;gap:28px">
    <div class="pane grow"><h3>Text thô từ PDF <span class="muted">${rawLines.length} dòng, xem ${SHOW} dòng cuối</span></h3><pre class="rawlines">${raw}</pre></div>
    <div class="pane grow"><h3>Sau chuẩn hóa <span class="muted">${paras.length} đoạn</span></h3><div class="prose">${lastParas}</div></div>
  </div>
  <div class="ops"><span>Bỏ header/footer lặp lại</span><span>Bỏ nhãn hộp viết hoa</span><span>Nối từ có gạch nối</span><span>Dựng đoạn theo độ dài dòng + dấu câu</span><span>Giữ nguyên dấu nháy để evidence vẫn khớp</span></div>`;
      }
    });

    slides.push({
      title: "Chunking", html: () => {
        const coh = csvRows("coherence");
        const a = coh.find((r) => r.position_id === "pos01" && r.strategy === "A");
        const b = coh.find((r) => r.position_id === "pos01" && r.strategy === "B");

    function csvTable(name, rows) {
      const { header } = D.audits[name];
      if (!rows.length) return `<div class="empty">Không có dòng nào trong <code>audit_${name}.csv</code> cho câu này — nhãn thủ công chỉ chấm cho 5 câu test.</div>`;
      const long = new Set(["text", "text_excerpt", "top1_text", "top2_text", "top3_text", "reason", "question"]);
      return `<table class="csv"><thead><tr>${header.map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map((r) => `<tr>${header.map((h, i) => `<td class="${long.has(h) ? "long" : ""}">${esc(r[i])}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    }
    function openSheet() {
      const q = state.q;
      const pick = (name, key) => { const { header, rows } = D.audits[name]; const i = header.indexOf(key); return rows.filter((r) => r[i] === q); };
      const trace = CONFIGS.map((c) => { const t = { ...TRACE[q][c] }; t.top_k = t.top_k.map((h) => ({ ...h, text: h.text.slice(0, 120) + "…" })); return t; });
      sheet.innerHTML = `<div class="sheet-h"><h3 id="sheet-title">Dữ liệu gốc · <span class="num">${q}</span></h3><button class="btn ghost" type="button" id="close-sheet">${ICON.close} Đóng <kbd>Esc</kbd></button></div>
    <div class="sheet-b"><h4>starter/results/audit_grounding.csv</h4>${csvTable("grounding", pick("grounding", "question_id"))}
    <h4>starter/results/audit_metadata.csv</h4>${csvTable("metadata", pick("metadata", "question_id"))}
    <h4>starter/results/traces_${state.split}.jsonl <span class="muted">(text rút gọn)</span></h4><pre class="rawlines" style="font-size:.8125rem">${esc(trace.map((t) => JSON.stringify(t)).join("\n"))}</pre></div>`;
      sheet.hidden = false; sheet.classList.add("is-open");
      document.getElementById("close-sheet").focus();
    }
    function closeSheet() {
      if (sheet.hidden) return;
      sheet.classList.remove("is-open"); sheet.hidden = true;
      document.getElementById("open-csv")?.focus();
    }

    /* ---------- navigation ---------- */
    const slidesEl = document.getElementById("slides");
    slidesEl.innerHTML = slides.map((s, i) => `<section class="slide ${s.cls || ""}" id="slide-${i}" aria-roledescription="slide" aria-label="${i + 1} / ${slides.length}: ${esc(s.title)}"></section>`).join("");
    document.getElementById("credit").innerHTML = `Nội dung trích: <i>${esc(S.title)}</i>, OpenStax, <a href="${esc(S.source_path_or_url)}">CC BY-NC-SA 4.0</a> · dữ liệu build ${esc(D.built_at.slice(0, 10))}`;

    function go(i, { focus = false } = {}) {
      i = Math.max(0, Math.min(slides.length - 1, i));
      closeSheet();
      const prev = slidesEl.querySelector(".slide.is-active");
      if (prev) { prev.classList.remove("is-active"); prev.innerHTML = ""; }
      const el = document.getElementById("slide-" + i);
      el.innerHTML = slides[i].html();
      el.classList.add("is-active");
      slides[i].after?.();
      state.slide = i;
      document.getElementById("counter").textContent = `${i + 1} / ${slides.length}`;
      document.getElementById("progress").style.transform = `scaleX(${(i + 1) / slides.length})`;
      document.getElementById("prev").disabled = i === 0;
      document.getElementById("next").disabled = i === slides.length - 1;
      document.getElementById("live").textContent = `Slide ${i + 1} / ${slides.length}: ${slides[i].title}`;
      const hash = slides[i].id === "explore" ? `#${i + 1}/${state.split}/${state.q || ""}` : `#${i + 1}`;
      history.replaceState(null, "", hash);
      if (focus) document.getElementById("stage").focus({ preventScroll: true });
    }
    const exploreIndex = slides.findIndex((s) => s.id === "explore");
    function openCase(split, id) { state.split = split; state.q = id; go(exploreIndex); }

    document.getElementById("prev").addEventListener("click", () => go(state.slide - 1));
    document.getElementById("next").addEventListener("click", () => go(state.slide + 1));
    document.getElementById("fs").addEventListener("click", toggleFs);
    function toggleFs() { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); }

    slidesEl.addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      if (b.dataset.open) { const [s, id] = b.dataset.open.split(":"); openCase(s, id); }
      else if (b.dataset.split) { state.split = b.dataset.split; state.q = null; renderExplorer(); go(state.slide); }
      else if (b.dataset.q) { state.q = b.dataset.q; renderExplorer(); history.replaceState(null, "", `#${state.slide + 1}/${state.split}/${state.q}`); }
      else if (b.dataset.pos) { state.pos = b.dataset.pos; renderCoherence(); }
      else if (b.id === "open-csv") openSheet();
    });
    sheet.addEventListener("click", (e) => { if (e.target.closest("#close-sheet")) closeSheet(); });

    function step(delta) {
      if (slides[state.slide].id === "explore") {
        const ids = idsOf(state.split); const i = ids.indexOf(state.q);
        state.q = ids[(i + delta + ids.length) % ids.length]; renderExplorer();
        history.replaceState(null, "", `#${state.slide + 1}/${state.split}/${state.q}`);
      } else if (slides[state.slide].id === "coherence") {
        const ps = [...new Set(csvRows("coherence").map((r) => r.position_id))]; const i = ps.indexOf(state.pos);
        state.pos = ps[(i + delta + ps.length) % ps.length]; renderCoherence();
      }
    }
    document.addEventListener("keydown", (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === "Escape") { closeSheet(); return; }
      if (!sheet.hidden) return;
      switch (e.key) {
        case "ArrowRight": case "PageDown": case " ": e.preventDefault(); go(state.slide + 1); break;
        case "ArrowLeft": case "PageUp": e.preventDefault(); go(state.slide - 1); break;
        case "ArrowDown": e.preventDefault(); step(1); break;
        case "ArrowUp": e.preventDefault(); step(-1); break;
        case "Home": go(0); break;
        case "End": go(slides.length - 1); break;
        case "f": case "F": toggleFs(); break;
      }
    });

    /* Fit 1600x900 stage into the viewport */
    function fit() { document.querySelector(".stage").style.setProperty("--k", Math.min(innerWidth / 1600, innerHeight / 900)); }
    addEventListener("resize", fit); fit();

    /* Deep link: #n or #n/split/qid */
    const m = location.hash.match(/^#(\d+)(?:\/(dev|test)\/(\w+))?/);
    if (m && m[2] && Q[m[3]]) { state.split = m[2]; state.q = m[3]; }
    go(m ? Number(m[1]) - 1 : 0);
  </script>
</body>
