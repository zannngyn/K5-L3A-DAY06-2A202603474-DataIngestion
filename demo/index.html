 or use of existing sources. Every research method comes with plusses and minuses, and the topic of study strongly influences which method or methods are put to use. When you are conducting research"}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p062-fixed-005", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 62, "chapter": 2, "section": "2.2", "score": 0.607885, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "he was cared for and taught some human behaviors, but she never became fully socialized. She has been designated as unable to support herself and now lives in a mental institution (Grice 2011). Case studies like this offer a way for sociologists to collect data that may not be obtained by any other method.\n\nExperiments\n\nYou have probably tested some of your own personal social theories. “If I study at night and review in the morning, I’ll improve my retention skills.” Or, “If I stop drinking sod"}], "config": "A", "index": "A"}, {"id": "t02", "split": "test", "type": "paraphrase", "question": "In the bumper sticker experiment on police treatment of drivers, how many citations did the drivers get and over how many days?", "expected_answer": "Thirty-three citations in seventeen days.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [64], "evidence_quote": "After seventeen days, the fifteen drivers had collected a total of thirty-three traffic citations.", "filter": null, "filter_applied": null, "hit@1": false, "hit@3": true, "first_hit_rank": 3, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p064-fixed-000", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 64, "chapter": 2, "section": "2.2", "score": 0.708947, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "California State University at Los Angeles, had a theory about police prejudice. To test her theory, she conducted research. She chose fifteen students from three ethnic backgrounds: Black, White, and Hispanic. She chose students who routinely drove to and from campus along Los Angeles freeway routes, and who had had perfect driving records for longer than a year.\n\nNext, she placed a Black Panther bumper sticker on each car. That sticker, a representation of a social value, was the independent v"}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p064-fixed-001", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 64, "chapter": 2, "section": "2.2", "score": 0.671879, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "sentation of a social value, was the independent variable. In the 1970s, the Black Panthers were a revolutionary group actively fighting racism. Heussenstamm asked the students to follow their normal driving patterns. She wanted to see whether seeming support for the Black Panthers would change how these good drivers were treated by the police patrolling the highways. The dependent variable would be the number of traffic stops/citations.\n\nThe first arrest, for an incorrect lane change, was made "}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p064-fixed-002", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 64, "chapter": 2, "section": "2.2", "score": 0.630445, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "st arrest, for an incorrect lane change, was made two hours after the experiment began. One participant was pulled over three times in three days. He quit the study. After seventeen days, the fifteen drivers had collected a total of thirty-three traffic citations. The research was halted. The funding to pay traffic fines had run out, and so had the enthusiasm of the participants (Heussenstamm, 1971).\n\nSecondary Data Analysis\n\nWhile sociologists often engage in original research studies, they als"}], "config": "A", "index": "A"}, {"id": "t03", "split": "test", "type": "direct", "question": "Whose research did the Supreme Court cite in Brown vs. the Board of Education?", "expected_answer": "Kenneth and Mamie Clark.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [35], "evidence_quote": "the Supreme Court cited the research of the husband-and-wife team of social scientists, Kenneth and Mamie Clark", "filter": null, "filter_applied": null, "hit@1": false, "hit@3": true, "first_hit_rank": 2, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p035-fixed-000", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 35, "chapter": 1, "section": "1.4", "score": 0.746134, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "1.4 Why Study Sociology?\n\nLEARNING OBJECTIVES\n\nBy the end of this section, you should be able to:\n\n• Explain why it is worthwhile to study sociology.\n\n• Identify ways sociology is applied in the real world.\n\nFIGURE 1.9 The research of Kenneth and Mamie Clark helped the Supreme Court decide to end “separate but equal” racial segregation in schools in the United States. (Credit: University of Texas) When Elizabeth Eckford tried to enter Central High School in Little Rock, Arkansas, in September 19"}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p035-fixed-002", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 35, "chapter": 1, "section": "1.4", "score": 0.677748, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "t of momentous, not only for education, but for a number of other segregation and discrimination issues that have lasted into this decade. And in that momentous decision, the Supreme Court cited the research of the husband-and-wife team of social scientists, Kenneth and Mamie Clark, as evidence that segregation generates in minority students a feeling of inferiority. In the ‘doll test,’ for example, the Clarks showed children four dolls, two with white skin and yellow hair and two with brown ski"}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p035-fixed-004", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 35, "chapter": 1, "section": "1.4", "score": 0.668751, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "r became depressed. The Clarks’ research contributed to the Supreme Court’s conclusion that separate but equal was damaging to students, and that separate facilities are unequal.\n\nSociology and a Better Society\n\nSince it was first founded, many people interested in sociology have been driven by the scholarly desire to contribute knowledge to this field, while others have seen it as way not only to study society but also to improve it. Besides desegregation, sociology has played a crucial role in"}], "config": "A", "index": "A"}, {"id": "t04", "split": "test", "type": "metadata_filter", "question": "Which study investigated whether people can get by on minimum-wage work?", "expected_answer": "Barbara Ehrenreich's participant observation for her book Nickel and Dimed.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [59], "evidence_quote": "This type of research is what journalist Barbara Ehrenreich conducted for her book Nickel and Dimed.", "filter": {"chapter": 2}, "filter_applied": null, "hit@1": false, "hit@3": false, "first_hit_rank": null, "failure": "gold_page_without_evidence", "filter_compliant": false, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p059-fixed-003", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 59, "chapter": 2, "section": "2.2", "score": 0.661723, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "l chain employee. During her participant observation, she used only her income from those jobs to pay for food, clothing, transportation, and shelter.\n\nShe discovered the obvious, that it’s almost impossible to get by on minimum wage work. She also experienced and observed attitudes many middle and upper-class people never think about. She witnessed firsthand the treatment of working class employees. She saw the extreme measures people take to make ends meet and to survive. She described fellow "}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p027-fixed-001", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 27, "chapter": 1, "section": "1.2", "score": 0.639302, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "t some job loss would be greatly offset by the positive effects on the standard of living of low-wage workers and reducing the income gap between the rich and poor.\n\nSociologists may consider the minimum wage issue from differing perspectives as well. How much of an impact would a minimum wage raise have for a single mother? Some might study the economic effects, such as her ability to pay bills and keep food on the table. Others might look at how reduced economic stress could improve family rel"}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p059-fixed-002", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 59, "chapter": 2, "section": "2.2", "score": 0.623625, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "red. Someone should do a study. To her surprise, her editor responded, Why don’t you do it?\n\nThat’s how Ehrenreich found herself joining the ranks of the working class. For several months, she left her comfortable home and lived and worked among people who lacked, for the most part, higher education and marketable job skills. Undercover, she applied for and worked minimum wage jobs as a waitress, a cleaning woman, a nursing home aide, and a retail chain employee. During her participant observati"}], "config": "A", "index": "A"}, {"id": "t05", "split": "test", "type": "metadata_filter", "question": "How does qualitative sociology seek to understand human behavior?", "expected_answer": "Through in-depth interviews, focus groups, and analysis of content sources.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [26], "evidence_quote": "Qualitative sociology seeks to understand human behavior by learning about it through in-depth interviews, focus groups, and analysis of content sources", "filter": {"chapter": 1}, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": false, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p026-fixed-008", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 26, "chapter": 1, "section": "1.2", "score": 0.775547, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "ology uses statistical methods such as surveys with large numbers of participants. Researchers analyze data using statistical techniques to see if they can uncover patterns of human behavior. Qualitative sociology seeks to understand human behavior by learning about it through in-depth interviews, focus groups, and analysis of content sources (like books, magazines, journals, and popular media)."}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p026-fixed-007", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 26, "chapter": 1, "section": "1.2", "score": 0.682436, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "rocesses, cultural norms, and societal values. This approach led to some research methods whose aim was not to generalize or predict (traditional in science), but to systematically gain an in-depth understanding of social worlds.\n\nThe different approaches to research based on positivism or anti-positivism are often considered the foundation for the differences found today between quantitative sociology and qualitative sociology. Quantitative sociology uses statistical methods such as surveys wit"}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p048-fixed-001", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 48, "chapter": 2, "section": "2.1", "score": 0.593699, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "arch study.\n\nWhen sociologists apply the sociological perspective and begin to ask questions, no topic is off limits. Every aspect of human behavior is a source of possible investigation. Sociologists question the world that humans have created and live in. They notice patterns of behavior as people move through that world. Using sociological methods and systematic research within the framework of the scientific method and a scholarly interpretive perspective, sociologists have discovered social"}], "config": "A", "index": "A"}, {"id": "t01", "split": "test", "type": "condition_exception", "question": "Case studies are rarely a primary method, but in what situation are they especially useful?", "expected_answer": "When the single case is unique, e.g. a feral child.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [62], "evidence_quote": "However, case studies are useful when the single case is unique.", "filter": null, "filter_applied": null, "hit@1": false, "hit@3": false, "first_hit_rank": null, "failure": "gold_page_without_evidence", "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p062-para-001", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 62, "chapter": 2, "section": "2.2", "score": 0.680171, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "Researchers might use this method to study a single case of a foster child, drug lord, cancer patient, criminal, or rape victim. However, a major criticism of the case study as a method is that while offering depth on a topic, it does not provide enough evidence to form a generalized conclusion. In other words, it is difficult to make universal claims based on just one person, since one person does not verify a pattern. This is why most sociologists do not use case studies as a primary research method."}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p052-para-006", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 52, "chapter": 2, "section": "2.2", "score": 0.637245, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "Sociologists examine the social world, see a problem or interesting pattern, and set out to study it. They use research methods to design a study. Planning the research design is a key step in any sociological study. Sociologists generally choose from widely used methods of social investigation: primary source data collection such as survey, participant observation, ethnography, case study, unobtrusive observations, experiment, and secondary data analysis, or use of existing sources. Every research method comes with plusses and minuses, and the topic of study strongly influences which method or methods are put to use. When you are conducting research think about the best way to gather or obtain knowledge about your topic, think of yourself as an architect. "}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p062-para-000", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 62, "chapter": 2, "section": "2.2", "score": 0.60984, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "FIGURE 2.9 A classroom in Muncie, Indiana, in 1917, five years before John and Helen Lynd began researching this “typical” U.S. community. (Credit: Don O’Brien/flickr)\n\nCase Study\n\nSometimes a researcher wants to study one specific person or event. A case study is an in-depth analysis of a single event, situation, or individual. To conduct a case study, a researcher examines existing sources like documents and archival records, conducts interviews, engages in direct observation and even participant observation, if possible."}], "config": "B", "index": "B"}, {"id": "t02", "split": "test", "type": "paraphrase", "question": "In the bumper sticker experiment on police treatment of drivers, how many citations did the drivers get and over how many days?", "expected_answer": "Thirty-three citations in seventeen days.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [64], "evidence_quote": "After seventeen days, the fifteen drivers had collected a total of thirty-three traffic citations.", "filter": null, "filter_applied": null, "hit@1": false, "hit@3": true, "first_hit_rank": 2, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p064-para-001", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 64, "chapter": 2, "section": "2.2", "score": 0.642481, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "Next, she placed a Black Panther bumper sticker on each car. That sticker, a representation of a social value, was the independent variable. In the 1970s, the Black Panthers were a revolutionary group actively fighting racism. Heussenstamm asked the students to follow their normal driving patterns. She wanted to see whether seeming support for the Black Panthers would change how these good drivers were treated by the police patrolling the highways. The dependent variable would be the number of traffic stops/citations."}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p064-para-002", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 64, "chapter": 2, "section": "2.2", "score": 0.634105, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "The first arrest, for an incorrect lane change, was made two hours after the experiment began. One participant was pulled over three times in three days. He quit the study. After seventeen days, the fifteen drivers had collected a total of thirty-three traffic citations. The research was halted. The funding to pay traffic fines had run out, and so had the enthusiasm of the participants (Heussenstamm, 1971)."}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p064-para-000", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 64, "chapter": 2, "section": "2.2", "score": 0.634094, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "California State University at Los Angeles, had a theory about police prejudice. To test her theory, she conducted research. She chose fifteen students from three ethnic backgrounds: Black, White, and Hispanic. She chose students who routinely drove to and from campus along Los Angeles freeway routes, and who had had perfect driving records for longer than a year."}], "config": "B", "index": "B"}, {"id": "t03", "split": "test", "type": "direct", "question": "Whose research did the Supreme Court cite in Brown vs. the Board of Education?", "expected_answer": "Kenneth and Mamie Clark.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [35], "evidence_quote": "the Supreme Court cited the research of the husband-and-wife team of social scientists, Kenneth and Mamie Clark", "filter": null, "filter_applied": null, "hit@1": false, "hit@3": true, "first_hit_rank": 2, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p035-para-001", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 35, "chapter": 1, "section": "1.4", "score": 0.675578, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "FIGURE 1.9 The research of Kenneth and Mamie Clark helped the Supreme Court decide to end “separate but equal” racial segregation in schools in the United States. (Credit: University of Texas) When Elizabeth Eckford tried to enter Central High School in Little Rock, Arkansas, in September 1957, she was met by an angry crowd and was turned away by authorities. But she knew she had the law on her side. Three years earlier in the landmark Brown vs. the Board of Education decision, the U.S. Supreme Court had overturned twenty-one state laws that allowed Black and White people to be taught in separate school systems as long as the school systems were “equal.” "}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p035-para-002", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 35, "chapter": 1, "section": "1.4", "score": 0.6608, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "The decision was nothing short of momentous, not only for education, but for a number of other segregation and discrimination issues that have lasted into this decade. And in that momentous decision, the Supreme Court cited the research of the husband-and-wife team of social scientists, Kenneth and Mamie Clark, as evidence that segregation generates in minority students a feeling of inferiority. In the ‘doll test,’ for example, the Clarks showed children four dolls, two with white skin and yellow hair and two with brown skin and black hair. When asked which doll they preferred, the majority of Black children chose the doll with the light skin doll, and they assigned positive characteristics to it. "}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p035-para-003", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 35, "chapter": 1, "section": "1.4", "score": 0.607396, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "Most of the Black children discarded the doll with the brown skin—the one that had a closer resemblance to themselves. When asked to choose the doll that looked like them, many children left the room, started to cry, and/or became depressed. The Clarks’ research contributed to the Supreme Court’s conclusion that separate but equal was damaging to students, and that separate facilities are unequal."}], "config": "B", "index": "B"}, {"id": "t04", "split": "test", "type": "metadata_filter", "question": "Which study investigated whether people can get by on minimum-wage work?", "expected_answer": "Barbara Ehrenreich's participant observation for her book Nickel and Dimed.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [59], "evidence_quote": "This type of research is what journalist Barbara Ehrenreich conducted for her book Nickel and Dimed.", "filter": {"chapter": 2}, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": true, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p059-para-001", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 59, "chapter": 2, "section": "2.2", "score": 0.705298, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "This type of research is what journalist Barbara Ehrenreich conducted for her book Nickel and Dimed. One day over lunch with her editor, Ehrenreich mentioned an idea. How can people exist on minimum-wage work? How do low-income workers get by? she wondered. Someone should do a study. To her surprise, her editor responded, Why don’t you do it?"}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p059-para-002", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 59, "chapter": 2, "section": "2.2", "score": 0.640096, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "That’s how Ehrenreich found herself joining the ranks of the working class. For several months, she left her comfortable home and lived and worked among people who lacked, for the most part, higher education and marketable job skills. Undercover, she applied for and worked minimum wage jobs as a waitress, a cleaning woman, a nursing home aide, and a retail chain employee. During her participant observation, she used only her income from those jobs to pay for food, clothing, transportation, and shelter."}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p059-para-003", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 59, "chapter": 2, "section": "2.2", "score": 0.591764, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "She discovered the obvious, that it’s almost impossible to get by on minimum wage work. She also experienced and observed attitudes many middle and upper-class people never think about. She witnessed firsthand the treatment of working class employees. She saw the extreme measures people take to make ends meet and to survive. She described fellow employees who held two or three jobs, worked seven days a week, lived in cars, could not pay to treat chronic health conditions, got randomly fired, submitted to drug tests, and moved in and out of homeless shelters. She brought aspects of that life to light, describing difficult working conditions and the poor treatment that low-wage workers suffer."}], "config": "B", "index": "B"}, {"id": "t05", "split": "test", "type": "metadata_filter", "question": "How does qualitative sociology seek to understand human behavior?", "expected_answer": "Through in-depth interviews, focus groups, and analysis of content sources.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [26], "evidence_quote": "Qualitative sociology seeks to understand human behavior by learning about it through in-depth interviews, focus groups, and analysis of content sources", "filter": {"chapter": 1}, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": true, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p026-para-005", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 26, "chapter": 1, "section": "1.2", "score": 0.753722, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "The different approaches to research based on positivism or anti-positivism are often considered the foundation for the differences found today between quantitative sociology and qualitative sociology. Quantitative sociology uses statistical methods such as surveys with large numbers of participants. Researchers analyze data using statistical techniques to see if they can uncover patterns of human behavior. Qualitative sociology seeks to understand human behavior by learning about it through in-depth interviews, focus groups, and analysis of content sources (like books, magazines, journals, and popular media)."}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p034-para-001", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 34, "chapter": 1, "section": "1.3", "score": 0.625244, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "Studies that use the symbolic interactionist perspective are more likely to use qualitative research methods, such as in-depth interviews or participant observation, because they seek to understand the symbolic worlds in which research subjects live."}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p026-para-004", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 26, "chapter": 1, "section": "1.2", "score": 0.598319, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "In The Nature of Social Action, Weber described sociology as striving to “... interpret the meaning of social action and thereby give a causal explanation of the way in which action proceeds and the effects it produces.” He and other like-minded sociologists proposed a philosophy of anti-positivism whereby social researchers would strive for subjectivity as they worked to represent social processes, cultural norms, and societal values. This approach led to some research methods whose aim was not to generalize or predict (traditional in science), but to systematically gain an in-depth understanding of social worlds."}], "config": "B", "index": "B"}, {"id": "t01", "split": "test", "type": "condition_excepti  null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p064-para-001", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 64, "chapter": 2, "section": "2.2", "score": 0.642481, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "Next, she placed a Black Panther bumper sticker on each car. That sticker, a representation of a social value, was the independent variable. In the 1970s, the Black Panthers were a revolutionary group actively fighting racism. Heussenstamm asked the students to follow their normal driving patterns. She wanted to see whether seeming support for the Black Panthers would change how these good drivers were treated by the police patrolling the highways. The dependent variable would be the number of traffic stops/citations."}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p064-para-002", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 64, "chapter": 2, "section": "2.2", "score": 0.634105, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "The first arrest, for an incorrect lane change, was made two hours after the experiment began. One participant was pulled over three times in three days. He quit the study. After seventeen days, the fifteen drivers had collected a total of thirty-three traffic citations. The research was halted. The funding to pay traffic fines had run out, and so had the enthusiasm of the participants (Heussenstamm, 1971)."}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p064-para-000", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 64, "chapter": 2, "section": "2.2", "score": 0.634094, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "California State University at Los Angeles, had a theory about police prejudice. To test her theory, she conducted research. She chose fifteen students from three ethnic backgrounds: Black, White, and Hispanic. She chose students who routinely drove to and from campus along Los Angeles freeway routes, and who had had perfect driving records for longer than a year."}], "config": "C", "index": "B"}, {"id": "t03", "split": "test", "type": "direct", "question": "Whose research did the Supreme Court cite in Brown vs. the Board of Education?", "expected_answer": "Kenneth and Mamie Clark.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [35], "evidence_quote": "the Supreme Court cited the research of the husband-and-wife team of social scientists, Kenneth and Mamie Clark", "filter": null, "filter_applied": null, "hit@1": false, "hit@3": true, "first_hit_rank": 2, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p035-para-001", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 35, "chapter": 1, "section": "1.4", "score": 0.675578, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "FIGURE 1.9 The research of Kenneth and Mamie Clark helped the Supreme Court decide to end “separate but equal” racial segregation in schools in the United States. (Credit: University of Texas) When Elizabeth Eckford tried to enter Central High School in Little Rock, Arkansas, in September 1957, she was met by an angry crowd and was turned away by authorities. But she knew she had the law on her side. Three years earlier in the landmark Brown vs. the Board of Education decision, the U.S. Supreme Court had overturned twenty-one state laws that allowed Black and White people to be taught in separate school systems as long as the school systems were “equal.” "}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p035-para-002", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 35, "chapter": 1, "section": "1.4", "score": 0.6608, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "The decision was nothing short of momentous, not only for education, but for a number of other segregation and discrimination issues that have lasted into this decade. And in that momentous decision, the Supreme Court cited the research of the husband-and-wife team of social scientists, Kenneth and Mamie Clark, as evidence that segregation generates in minority students a feeling of inferiority. In the ‘doll test,’ for example, the Clarks showed children four dolls, two with white skin and yellow hair and two with brown skin and black hair. When asked which doll they preferred, the majority of Black children chose the doll with the light skin doll, and they assigned positive characteristics to it. "}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p035-para-003", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 35, "chapter": 1, "section": "1.4", "score": 0.607396, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "Most of the Black children discarded the doll with the brown skin—the one that had a closer resemblance to themselves. When asked to choose the doll that looked like them, many children left the room, started to cry, and/or became depressed. The Clarks’ research contributed to the Supreme Court’s conclusion that separate but equal was damaging to students, and that separate facilities are unequal."}], "config": "C", "index": "B"}, {"id": "t04", "split": "test", "type": "metadata_filter", "question": "Which study investigated whether people can get by on minimum-wage work?", "expected_answer": "Barbara Ehrenreich's participant observation for her book Nickel and Dimed.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [59], "evidence_quote": "This type of research is what journalist Barbara Ehrenreich conducted for her book Nickel and Dimed.", "filter": {"chapter": 2}, "filter_applied": {"chapter": 2}, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": true, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p059-para-001", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 59, "chapter": 2, "section": "2.2", "score": 0.705298, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "This type of research is what journalist Barbara Ehrenreich conducted for her book Nickel and Dimed. One day over lunch with her editor, Ehrenreich mentioned an idea. How can people exist on minimum-wage work? How do low-income workers get by? she wondered. Someone should do a study. To her surprise, her editor responded, Why don’t you do it?"}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p059-para-002", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 59, "chapter": 2, "section": "2.2", "score": 0.640096, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "That’s how Ehrenreich found herself joining the ranks of the working class. For several months, she left her comfortable home and lived and worked among people who lacked, for the most part, higher education and marketable job skills. Undercover, she applied for and worked minimum wage jobs as a waitress, a cleaning woman, a nursing home aide, and a retail chain employee. During her participant observation, she used only her income from those jobs to pay for food, clothing, transportation, and shelter."}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p059-para-003", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 59, "chapter": 2, "section": "2.2", "score": 0.591764, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "She discovered the obvious, that it’s almost impossible to get by on minimum wage work. She also experienced and observed attitudes many middle and upper-class people never think about. She witnessed firsthand the treatment of working class employees. She saw the extreme measures people take to make ends meet and to survive. She described fellow employees who held two or three jobs, worked seven days a week, lived in cars, could not pay to treat chronic health conditions, got randomly fired, submitted to drug tests, and moved in and out of homeless shelters. She brought aspects of that life to light, describing difficult working conditions and the poor treatment that low-wage workers suffer."}], "config": "C", "index": "B"}, {"id": "t05", "split": "test", "type": "metadata_filter", "question": "How does qualitative sociology seek to understand human behavior?", "expected_answer": "Through in-depth interviews, focus groups, and analysis of content sources.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [26], "evidence_quote": "Qualitative sociology seeks to understand human behavior by learning about it through in-depth interviews, focus groups, and analysis of content sources", "filter": {"chapter": 1}, "filter_applied": {"chapter": 1}, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": true, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p026-para-005", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 26, "chapter": 1, "section": "1.2", "score": 0.753722, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "The different approaches to research based on positivism or anti-positivism are often considered the foundation for the differences found today between quantitative sociology and qualitative sociology. Quantitative sociology uses statistical methods such as surveys with large numbers of participants. Researchers analyze data using statistical techniques to see if they can uncover patterns of human behavior. Qualitative sociology seeks to understand human behavior by learning about it through in-depth interviews, focus groups, and analysis of content sources (like books, magazines, journals, and popular media)."}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p034-para-001", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 34, "chapter": 1, "section": "1.3", "score": 0.625244, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "Studies that use the symbolic interactionist perspective are more likely to use qualitative research methods, such as in-depth interviews or participant observation, because they seek to understand the symbolic worlds in which research subjects live."}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p026-para-004", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 26, "chapter": 1, "section": "1.2", "score": 0.598319, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "In The Nature of Social Action, Weber described sociology as striving to “... interpret the meaning of social action and thereby give a causal explanation of the way in which action proceeds and the effects it produces.” He and other like-minded sociologists proposed a philosophy of anti-positivism whereby social researchers would strive for subjectivity as they worked to represent social processes, cultural norms, and societal values. This approach led to some research methods whose aim was not to generalize or predict (traditional in science), but to systematically gain an in-depth understanding of social worlds."}], "config": "C", "index": "B"}]}, "audits": {"coherence": {"header": ["position_id", "page", "char_offset", "strategy", "chunk_id", "chunk_chars", "text", "coherence_0_2", "reason"], "rows": [["pos01", "19", "986", "A", "openstax-intro-sociology-3e-p019-fixed-002", "500", "st the crowd can be a tedious, nearly impossible process. And cutting across a river of determined commuters can be almost dangerous. Things are fast, relentless, and necessary. But are those hundred thousand or half a million or, in the case of Tokyo’s Shinjuku station, 3.5 million people really acting individually? It may seem surprising, but even with those numbers, strangers from across cities can synch up on the same schedules, use the same doors, take one leg of the trip together every day", "1", "Bắt đầu giữa từ ('st the crowd'), kết thúc giữa câu; vẫn đoán được đang nói về đám đông ở ga tàu."], ["pos01", "19", "986", "B", "openstax-intro-sociology-3e-p019-para-001", "740", "A busy commuter train station might seem like a very individualized place. Tens of thousands or hundreds of thousands of strangers flow through with a singular purpose: to get where they need to go. Whether walking through main doors at a pace of a dozen people each second, or arriving by train hundreds at a time, the station can feel a bit like a balloon being pumped too full. Throngs of people cluster in tight bottlenecks until they burst through corridors and stairways and tunnels to reach the next stage of their journey. In some stations, walking against the crowd can be a tedious, nearly impossible process. And cutting across a river of determined commuters can be almost dangerous. Things are fast, relentless, and necessary. ", "2", "Trọn đoạn mở đầu chương, câu đầu-cuối hoàn chỉnh."], ["pos02", "23", "1965", "A", "openstax-intro-sociology-3e-p023-fixed-004", "500", "ely subjective and do not offer an unbiased view of social practice.\n\nIn the 13th century, Ma Tuan-Lin, a Chinese historian, was the first to record, in his seminal encyclopedia titled General Study of Literary Remains, the social dynamics underlying and generating historical development. In the 14th century, the Tunisian historian Ibn Khaldun (1332–1406) set the foundation for both modern sociology and economics. Khaldun proposed a theory of social conflict and provided a comparison of nomadic ", "1", "Mở bằng mẩu câu của đoạn trước ('ely subjective...'), cắt giữa câu 'comparison of nomadic'."], ["pos02", "23", "1965", "B", "openstax-intro-sociology-3e-p023-para-004", "747", "In the 13th century, Ma Tuan-Lin, a Chinese historian, was the first to record, in his seminal encyclopedia titled General Study of Literary Remains, the social dynamics underlying and generating historical development. In the 14th century, the Tunisian historian Ibn Khaldun (1332–1406) set the foundation for both modern sociology and economics. Khaldun proposed a theory of social conflict and provided a comparison of nomadic and sedentary life, an analysis of political economy, and a study connecting a tribe’s social cohesion to its capacity for power (Hannoum, 2003). Khaldun often challenged authorities. As sociologists continue to study and report on social issues and problems, they often find themselves in the center of controversy. ", "2", "Trọn đoạn về Ma Tuan-Lin và Ibn Khaldun."], ["pos03", "27", "1444", "A", "openstax-intro-sociology-3e-p027-fixed-003", "500", "oy (2005), the challenge of public sociology is to engage multiple publics in multiple ways.\n\nApplying the Discipline: American Theorists and Practitioners\n\nFIGURE 1.6 From left to right, William Sumner, W.E.B. Du Bois, and Jane Adams. (Credit A, B, and C: Wikimedia Commons.)\n\nIn the early 1900s, sociology reached universities in the United States. William Sumner held the first professorship in sociology (Yale University), Franklin Giddings was the first full professor of Sociology (Columbia Uni", "1", "Mở bằng 'oy (2005)' (tên Burawoy bị cắt), trộn đuôi hộp chính sách + heading + chú thích hình, cắt 'Columbia Uni'."], ["pos03", "27", "1444", "B", "openstax-intro-sociology-3e-p027-para-002", "302", "According to Michael Burawoy (2005), the challenge of public sociology is to engage multiple publics in multiple ways.\n\nApplying the Discipline: American Theorists and Practitioners\n\nFIGURE 1.6 From left to right, William Sumner, W.E.B. Du Bois, and Jane Adams. (Credit A, B, and C: Wikimedia Commons.)", "1", "Câu hoàn chỉnh nhưng chỉ là câu đuôi của hộp 'public sociology' + heading + chú thích hình; thiếu ngữ cảnh public sociology là gì."], ["pos04", "31", "1203", "A", "openstax-intro-sociology-3e-p031-fixed-002", "500", "ieve that functionalism is no longer useful as a macro-level theory, but that it does serve a useful purpose in some mid-level analyses. A Global Culture?\n\nFIGURE 1.8 Some sociologists see the online world contributing to the creation of an emerging global culture. Are you a part of any global communities? This Indiana rabbi is participating in what was recognized as the longest Zoom meeting, which started in Australia after the Sabbath and proceeded through each of the world’s time zones, effec", "1", "Mở giữa từ ('ieve that'), heading 'A Global Culture?' dính vào cuối câu, chú thích hình bị cắt 'effec'."], ["pos04", "31", "1203", "B", "openstax-intro-sociology-3e-p031-para-002", "752", "FIGURE 1.8 Some sociologists see the online world contributing to the creation of an emerging global culture. Are you a part of any global communities? This Indiana rabbi is participating in what was recognized as the longest Zoom meeting, which started in Australia after the Sabbath and proceeded through each of the world’s time zones, effectively lasting much longer than a day. (Credit: Chabad Lubavitch/flickr) Sociologists around the world look closely for signs of what would be an unprecedented event: the emergence of a global culture. In the past, empires such as those that existed in China, Europe, Africa, and Central and South America linked people from many different countries, but those people rarely became part of a common culture. ", "2", "Chú thích hình + mở đầu hộp Global Culture, câu hoàn chỉnh, tự hiểu được."], ["pos05", "35", "1537", "A", "openstax-intro-sociology-3e-p035-fixed-003", "500", " white skin and yellow hair and two with brown skin and black hair. When asked which doll they preferred, the majority of Black children chose the doll with the light skin doll, and they assigned positive characteristics to it. Most of the Black children discarded the doll with the brown skin—the one that had a closer resemblance to themselves. When asked to choose the doll that looked like them, many children left the room, started to cry, and/or became depressed. The Clarks’ research contribut", "1", "Thiếu chủ thể: không nói ai làm 'doll test' (Clarks), mở giữa câu và cắt 'contribut'."], ["pos05", "35", "1537", "B", "openstax-intro-sociology-3e-p035-para-002", "707", "The decision was nothing short of momentous, not only for education, but for a number of other segregation and discrimination issues that have lasted into this decade. And in that momentous decision, the Supreme Court cited the research of the husband-and-wife team of social scientists, Kenneth and Mamie Clark, as evidence that segregation generates in minority students a feeling of inferiority. In the ‘doll test,’ for example, the Clarks showed children four dolls, two with white skin and yellow hair and two with brown skin and black hair. When asked which doll they preferred, the majority of Black children chose the doll with the light skin doll, and they assigned positive characteristics to it. ", "2", "Có bối cảnh phán quyết, tên Kenneth và Mamie Clark và mô tả doll test; câu hoàn chỉnh."], ["pos06", "49", "1547", "A", "openstax-intro-sociology-3e-p049-fixed-003", "500", "ly scientific logic and objectivity. They are interested in—but not attached to—the results. They work outside of their own political or social agendas. This does not mean researchers do not have their own personalities, complete with preferences and opinions. But sociologists deliberately use the scientific method to maintain as much objectivity, focus, and consistency as possible in collecting and analyzing data in research studies.\n\nWith its systematic approach, the scientific method has prov", "1", "Mở giữa từ ('ly scientific logic'), cắt cuối 'has prov'."], ["pos06", "49", "1547", "B", "openstax-intro-sociology-3e-p049-para-003", "562", "Sociologists can use the scientific method not only to collect but also to interpret and analyze data. They deliberately apply scientific logic and objectivity. They are interested in—but not attached to—the results. They work outside of their own political or social agendas. This does not mean researchers do not have their own personalities, complete with preferences and opinions. But sociologists deliberately use the scientific method to maintain as much objectivity, focus, and consistency as possible in collecting and analyzing data in research studies.", "2", "Trọn đoạn về tính khách quan của phương pháp khoa học."], ["pos07", "53", "1373", "A", "openstax-intro-sociology-3e-p053-fixed-002", "500", "subjects, and that fit with their overall approaches to research. Surveys\n\nAs a research method, a survey collects data from subjects who respond to a series of questions about behaviors and opinions, often in the form of a questionnaire or an interview. The survey is one of the most widely used scientific research methods. The standard survey format allows individuals a level of anonymity in which they can express personal ideas.\n\nFIGURE 2.3 Questionnaires are a common research method. (Credit:", "1", "Mở giữa câu, heading 'Surveys' dính vào cuối câu trước, chú thích hình bị cắt '(Credit:'."], ["pos07", "53", "1373", "B", "openstax-intro-sociology-3e-p053-para-001", "666", "In situations like these, other methods are needed. Researchers choose methods that best suit their study topics, protect research participants or subjects, and that fit with their overall approaches to research. Surveys\n\nAs a research method, a survey collects data from subjects who respond to a series of questions about behaviors and opinions, often in the form of a questionnaire or an interview. The survey is one of the most widely used scientific research methods. The standard survey format allows individuals a level of anonymity in which they can express personal ideas.\n\nFIGURE 2.3 Questionnaires are a common research method. (Credit: CDC Global/flickr)", "1", "Đoạn Surveys trọn vẹn nhưng câu đầu 'In situations like these' thiếu ngữ cảnh; heading 'Surveys' dính vào cuối đoạn trước (lỗi dựng đoạn)."], ["pos08", "57", "1522", "A", "openstax-intro-sociology-3e-p057-fixed-003", "500", "ey Rothman wanted an insider’s view of white-collar work. He slipped into the sterile, high-rise offices of a New York “dot com” agency. Every day for two weeks, he pretended to work there. His main purpose was simply to see whether anyone would notice him or challenge his presence. No one did. The receptionist greeted him. The employees smiled and said good morning. Rothman was accepted as part of the team. He even went so far as to claim a desk, inform the receptionist of his whereabouts, and ", "1", "Tên bị cắt ('ey Rothman'), kết thúc giữa câu 'and '."], ["pos08", "57", "1522", "B", "openstax-intro-sociology-3e-p057-para-003", "785", "Participant Observation\n\nIn 2000, a comic writer named Rodney Rothman wanted an insider’s view of white-collar work. He slipped into the sterile, high-rise offices of a New York “dot com” agency. Every day for two weeks, he pretended to work there. His main purpose was simply to see whether anyone would notice him or challenge his presence. No one did. The receptionist greeted him. The employees smiled and said good morning. Rothman was accepted as part of the team. He even went so far as to claim a desk, inform the receptionist of his whereabouts, and attend a meeting. He published an article about his experience in The New Yorker called “My Fake Job” (2000). Later, he was discredited for allegedly fabricating some details of the story and The New Yorker issued an apology. ", "2", "Có heading Participant Observation và trọn câu chuyện Rothman."], ["pos09", "61", "1485", "A", "openstax-intro-sociology-3e-p061-fixed-003", "500", "as dealing with abstract concepts and symbols, while working class people used tools to create concrete objects. The two classes led different lives with different goals and hopes. However, the Lynds observed, mass production offered both classes the same amenities. Like wealthy families, the working class was now able to own radios, cars, washing machines, telephones, vacuum cleaners, and refrigerators. This was an emerging material reality of the 1920s.\n\nAs the Lynds worked, they divided their", "1", "Mở giữa câu ('as dealing with abstract concepts'), cắt cuối 'they divided their'."], ["pos09", "61", "1485", "B", "openstax-intro-sociology-3e-p061-para-002", "565", "They observed that Muncie was divided into business and working class groups. They defined business class as dealing with abstract concepts and symbols, while working class people used tools to create concrete objects. The two classes led different lives with different goals and hopes. However, the Lynds observed, mass production offered both classes the same amenities. Like wealthy families, the working class was now able to own radios, cars, washing machines, telephones, vacuum cleaners, and refrigerators. This was an emerging material reality of the 1920s.", "2", "Trọn đoạn; 'They' và 'the Lynds' đủ rõ trong chính chunk."], ["pos10", "65", "1979", "A", "openstax-intro-sociology-3e-p065-fixed-004", "500", " Weber understood that personal values could distort the framework for disclosing study results. While he accepted that some aspects of research design might be influenced by personal values, he declared it was entirely inappropriate to allow personal values to shape the interpretation of the responses. Sociologists, he stated, must establish value neutrality, a practice of remaining impartial, without bias or judgment, during the course of a study and in publishing results (Weber, 1949). Sociol", "1", "Thiếu câu giới thiệu Weber và mối quan tâm đạo đức; cắt cuối 'Sociol'."], ["pos10", "65", "1979", "B", "openstax-intro-sociology-3e-p065-para-003", "691", "Pioneer German sociologist Max Weber (1864–1920) identified another crucial ethical concern. Weber understood that personal values could distort the framework for disclosing study results. While he accepted that some aspects of research design might be influenced by personal values, he declared it was entirely inappropriate to allow personal values to shape the interpretation of the responses. Sociologists, he stated, must establish value neutrality, a practice of remaining impartial, without bias or judgment, during the course of a study and in publishing results (Weber, 1949). Sociologists are obligated to disclose research findings without omitting or distorting significant data.", "2", "Trọn đoạn: Weber, mối quan tâm đạo đức, value neutrality."]]}, "metadata": {"header": ["question_id", "config", "rank", "chunk_id", "source", "page", "chapter", "section", "required_chapter", "text_excerpt", "source_ok", "page_ok", "chapter_ok", "section_ok", "notes"], "rows": [["t01", "A", "1", "openstax-intro-sociology-3e-p062-fixed-002", "https://openstax.org/details/books/introduction-sociology-3e", "62", "2", "2.2", "", "ne person, since one person does not verify a pattern. This is why most sociologists do not use case studies as a primary research method.\n\nHowever, case studies are useful when the single case is unique. In these instances, a single case stud
