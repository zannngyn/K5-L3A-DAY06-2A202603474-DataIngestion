185, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "to communicate their message.\n\nThe focus on the importance of symbols in building a society led sociologists like Erving Goffman (1922-1982) to develop a technique called dramaturgical analysis. Goffman used theater as an analogy for social interaction and recognized that people’s interactions showed patterns of cultural “scripts.” He argued that individuals were actors in a play. We switched roles, sometimes minute to minute—for example, from student or daughter to dog walker. Because it can be unclear what part a person may play in a given situation, he or she has to improvise his or her role as the situation unfolds (Goffman, 1958)."}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p033-para-004", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 33, "chapter": 1, "section": "1.3", "score": 0.60627, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "Symbolic Interactionist Theory\n\nSymbolic interactionism is a micro-level theory that focuses on the relationships among individuals within a society. Communication—the exchange of meaning through language and symbols—is believed to be the way in which people make sense of their social worlds. Theorists Herman and Reynolds (1994) note that this perspective sees people as being active in shaping the social world rather than simply being acted upon. George Herbert Mead is considered a founder of symbolic interactionism though he never published his work on it (LaRossa and Reitzes, 1993). "}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p028-para-005", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 28, "chapter": 1, "section": "1.2", "score": 0.555308, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "George Herbert Mead was a philosopher and sociologist whose work focused on the ways in which the mind and the self were developed as a result of social processes (Cronk, n.d.). He argued that how an individual comes to view himself or herself is based to a very large extent on interactions with others. Though Mead adopted Cooley’s concept of ‘looking-glasses,’ Mead felt that an individual’s reaction to a positive or negative reflection depended on who the ‘other’ was. Individuals that had the greatest impact on a person’s life were significant others while generalized others were the organized and generalized attitude of a social group. Mead often shares the title of father of symbolic interactionism with Cooley and Erving Goffman. Robert E. Park (1864-1944)"}], "config": "B", "index": "B"}, {"id": "q10", "split": "dev", "type": "direct", "question": "In the hypothesis 'if unemployment increases, then the crime rate will increase', which is the independent variable and which is the dependent variable?", "expected_answer": "Unemployment is the independent variable; the crime rate is the dependent variable.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [50], "evidence_quote": "unemployment is the independent variable and the crime rate is the dependent variable.", "filter": null, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p050-para-003", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 50, "chapter": 2, "section": "2.1", "score": 0.861215, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "Step 3: Formulate a Hypothesis\n\nA hypothesis is an explanation for a phenomenon based on a conjecture about the relationship between the phenomenon and one or more causal factors. In sociology, the hypothesis will often predict how one form of human behavior influences another. For example, a hypothesis might be in the form of an “if, then” statement. Let’s relate this to our topic of crime: If unemployment increases, then the crime rate will increase. In scientific research, we formulate hypotheses to include an independent variable (IV), which is the cause of the change, and a dependent variable (DV), which is the effect, or thing that is changed. In the example above, unemployment is the independent variable and the crime rate is the dependent variable."}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p050-para-004", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 50, "chapter": 2, "section": "2.1", "score": 0.718229, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "In a sociological study, the researcher would establish one form of human behavior as the independent variable and observe the influence it has on a dependent variable. How does gender (the independent variable) affect rate of income (the dependent variable)? How does one’s religion (the independent variable) affect family size (the dependent variable)? How is social class (the dependent variable) affected by level of education (the independent variable)?\n\nHypothesis Independent\n\nVariable\n\nDependent\n\nVariable\n\nThe greater the availability of affordable housing, the lower the\n\nhomeless rate. Affordable Housing Homeless Rate The greater the availability of math tutoring, the higher the math"}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p051-para-000", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 51, "chapter": 2, "section": "2.1", "score": 0.687929, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "Taking an example from Table 12.1, a researcher might hypothesize that teaching children proper hygiene (the independent variable) will boost their sense of self-esteem (the dependent variable). Note, however, this hypothesis can also work the other way around. A sociologist might predict that increasing a child’s sense of self-esteem (the independent variable) will increase or improve habits of hygiene (now the dependent variable). Identifying the independent and dependent variables is very important. As the hygiene example shows, simply identifying related two topics or variables is not enough. Their prospective relationship must be part of the hypothesis."}], "config": "B", "index": "B"}, {"id": "q11", "split": "dev", "type": "paraphrase", "question": "Which research quality describes how well a study measures what it was designed to measure?", "expected_answer": "Validity.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [51], "evidence_quote": "Researchers also strive for validity, which refers to how well the study measures what it was designed to measure.", "filter": null, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p051-para-002", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 51, "chapter": 2, "section": "2.1", "score": 0.681464, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "Researchers also strive for validity, which refers to how well the study measures what it was designed to measure. To produce reliable and valid results, sociologists develop an operational definition, that is, they define each concept, or variable, in terms of the physical or concrete steps it takes to objectively measure it. The operational definition identifies an observable condition of the concept. By operationalizing the concept, all researchers can collect data in a systematic or replicable manner. Moreover, researchers can determine whether the experiment or method validly represent the phenomenon they intended to study. "}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p048-para-000", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 48, "chapter": 2, "section": "2.0", "score": 0.636219, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "approaches and methods sociologists use to conduct studies like this one.\n\n2.1 Approaches to Sociological Research\n\nLEARNING OBJECTIVES\n\nBy the end of this section, you should be able to:\n\n• Define and describe the scientific method.\n\n• Explain how the scientific method is used in sociological research.\n\n• Describe the function and importance of an interpretive framework.\n\n• Describe the differences in accuracy, reliability and validity in a research study."}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p051-para-001", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 51, "chapter": 2, "section": "2.1", "score": 0.584552, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "Step 4: Design and Conduct a Study\n\nResearchers design studies to maximize reliability, which refers to how likely research results are to be replicated if the study is reproduced. Reliability increases the likelihood that what happens to one person will happen to all people in a group or what will happen in one situation will happen in another. Cooking is a science. When you follow a recipe and measure ingredients with a cooking tool, such as a measuring cup, the same results is obtained as long as the cook follows the same recipe and uses the same type of tool. The measuring cup introduces accuracy into the process. If a person uses a less accurate tool, such as their hand, to measure ingredients rather than a cup, the same result may not be replicated. Accurate tools and methods increase reliability."}], "config": "B", "index": "B"}, {"id": "q12", "split": "dev", "type": "direct", "question": "What defines a random sample?", "expected_answer": "Every person in the population has the same chance of being chosen for the study.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [54], "evidence_quote": "In a random sample, every person in a population has the same chance of being chosen for the study.", "filter": null, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p054-para-001", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 54, "chapter": 2, "section": "2.2", "score": 0.670642, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "A survey targets a specific population, people who are the focus of a study, such as college athletes, international students, or teenagers living with type 1 (juvenile-onset) diabetes. Most researchers choose to survey a small sector of the population, or a sample, a manageable number of subjects who represent a larger population. The success of a study depends on how well a population is represented by the sample. In a random sample, every person in a population has the same chance of being chosen for the study. As a result, a Gallup Poll, if conducted as a nationwide random sampling, should be able to provide an accurate estimate of public opinion whether it contacts 2,000 or 10,000 people."}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p051-para-002", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 51, "chapter": 2, "section": "2.1", "score": 0.457687, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "Researchers also strive for validity, which refers to how well the study measures what it was designed to measure. To produce reliable and valid results, sociologists develop an operational definition, that is, they define each concept, or variable, in terms of the physical or concrete steps it takes to objectively measure it. The operational definition identifies an observable condition of the concept. By operationalizing the concept, all researchers can collect data in a systematic or replicable manner. Moreover, researchers can determine whether the experiment or method validly represent the phenomenon they intended to study. "}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p053-para-003", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 53, "chapter": 2, "section": "2.2", "score": 0.452921, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "Not all surveys are considered sociological research, however, and many surveys people commonly encounter focus on identifying marketing needs and strategies rather than testing a hypothesis or contributing to social science knowledge. Questions such as, “How many hot dogs do you eat in a month?” or “Were the staff helpful?” are not usually designed as scientific research. The Nielsen Ratings determine the popularity of television programming through scientific market research. However, polls conducted by television programs such as American Idol or So You Think You Can Dance cannot be generalized, because they are administered to an unrepresentative population, a specific show’s audience. "}], "config": "B", "index": "B"}, {"id": "q13", "split": "dev", "type": "condition_exception", "question": "Why is the Hawthorne effect unavoidable in some research studies?", "expected_answer": "Because sociologists have to make the purpose of the study known, so subjects know they are being observed.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [63], "evidence_quote": "The Hawthorne effect is unavoidable in some research studies because sociologists have to make the purpose of the study known.", "filter": null, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p063-para-003", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 63, "chapter": 2, "section": "2.2", "score": 0.824025, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "And if a researcher told the students they would be observed as part of a study on measuring the effectiveness of tutoring, the students might not behave naturally. This is called the Hawthorne effect—which occurs when people change their behavior because they know they are being watched as part of a study. The Hawthorne effect is unavoidable in some research studies because sociologists have to make the purpose of the study known. Subjects must be aware that they are being observed, and a certain amount of artificiality may result (Sonnenfeld 1985).\n\nFIGURE 2.10 Sociologist Frances Heussenstamm conducted research to explore the correlation between traffic stops and race-based bumper stickers. This issue of racial profiling remains a hot-button topic today. (Credit: dwightsghost/flickr)"}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p058-para-003", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 58, "chapter": 2, "section": "2.2", "score": 0.576426, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "The Lynds were upfront about their mission. The townspeople of Muncie, Indiana, knew why the researchers were in their midst. But some sociologists prefer not to alert people to their presence. The main advantage of covert participant observation is that it allows the researcher access to authentic, natural behaviors of a group’s members. The challenge, however, is gaining access to a setting without disrupting the pattern of others’ behavior. Becoming an inside member of a group, organization, or subculture takes time and effort. Researchers must pretend to be something they are not. The process could involve role playing, making"}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p053-para-000", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 53, "chapter": 2, "section": "2.2", "score": 0.570297, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "When entering a particular social environment, a researcher must be careful. There are times to remain anonymous and times to be overt. There are times to conduct interviews and times to simply observe. Some participants need to be thoroughly informed; others should not know they are being observed. A researcher wouldn’t stroll into a crime-ridden neighborhood at midnight, calling out, “Any gang members around?” Making sociologists’ presence invisible is not always realistic for other reasons. That option is not available to a researcher studying prison behaviors, early education, or the Ku Klux Klan. Researchers can’t just stroll into prisons, kindergarten classrooms, or Klan meetings and unobtrusively observe behaviors or attract attention. "}], "config": "B", "index": "B"}, {"id": "q14", "split": "dev", "type": "metadata_filter", "question": "What did the Frankfurt School develop as an elaboration on Marxist principles?", "expected_answer": "Critical theory.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [32], "evidence_quote": "In the 1930s and 1940s, German philosophers, known as the Frankfurt School, developed critical theory as an elaboration on Marxist principles.", "filter": {"chapter": 1}, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": false, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p032-para-005", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 32, "chapter": 1, "section": "1.3", "score": 0.711416, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "In the 1930s and 1940s, German philosophers, known as the Frankfurt School, developed critical theory as an elaboration on Marxist principles. Critical theory is an expansion of conflict theory and is broader than just sociology, incorporating other social sciences and philosophy. A critical theory is a holistic theory and attempts to address structural issues causing inequality. It must explain what’s wrong in current social reality, identify the people who can make changes, and provide practical goals for social transformation (Horkeimer, 1982)."}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p052-para-004", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 52, "chapter": 2, "section": "2.1", "score": 0.596144, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "Critical Sociology\n\nCritical sociology focuses on deconstruction of existing sociological research and theory. Informed by the work of Karl Marx, scholars known collectively as the Frankfurt School proposed that social science, as much as any academic pursuit, is embedded in the system of power constituted by the set of class, caste, race, gender, and other relationships that exist in the society. Consequently, it cannot be treated as purely objective. Critical sociologists view theories, methods, and the conclusions as serving one of two purposes: they can either legitimate and rationalize systems of social power and oppression or liberate humans from inequality and restriction on human freedom. Deconstruction can involve data collection, but the analysis of this data is not empirical or positivist."}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p025-para-003", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 25, "chapter": 1, "section": "1.2", "score": 0.546823, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "Karl Marx was a German philosopher and economist. In 1848, he and Friedrich Engels (1820–1895) coauthored the Communist Manifesto. This book is one of the most influential political manuscripts in history. It also presents Marx’s theory of society, which differed from what Comte proposed.\n\nMarx rejected Comte’s positivism. He believed that societies grew and changed as a result of the struggles of different social classes over the means of production. At the time he was developing his theories, the Industrial Revolution and the rise of capitalism led to great disparities in wealth between the owners of the factories and workers. Capitalism, an economic system characterized by private or corporate ownership of goods and the means to produce them, had developed in many nations."}], "config": "B", "index": "B"}, {"id": "q15", "split": "dev", "type": "metadata_filter", "question": "What ethical concern did Max Weber identify for sociological research?", "expected_answer": "Personal values must not shape interpretation of results; sociologists must establish value neutrality.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [65], "evidence_quote": "Sociologists, he stated, must establish value neutrality, a practice of remaining impartial, without bias or judgment, during the course of a study and in publishing results", "filter": {"chapter": 2}, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": false, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p065-para-003", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 65, "chapter": 2, "section": "2.3", "score": 0.820806, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "Pioneer German sociologist Max Weber (1864–1920) identified another crucial ethical concern. Weber understood that personal values could distort the framework for disclosing study results. While he accepted that some aspects of research design might be influenced by personal values, he declared it was entirely inappropriate to allow personal values to shape the interpretation of the responses. Sociologists, he stated, must establish value neutrality, a practice of remaining impartial, without bias or judgment, during the course of a study and in publishing results (Weber, 1949). Sociologists are obligated to disclose research findings without omitting or distorting significant data."}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p026-para-003", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 26, "chapter": 1, "section": "1.2", "score": 0.666345, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "Weber believed that it was difficult, if not impossible, to use standard scientific methods to accurately predict the behavior of groups as some sociologists hoped to do. Weber argued that the influence of culture on human behavior had to be taken into account. This even applied to the researchers themselves, who should be aware of how their own cultural biases could influence their research. To deal with this problem, Weber and Wilhelm Dilthey introduced the concept of verstehen, a German word that means to understand in a deep way. In seeking verstehen, outside observers of a social world—an entire culture or a small setting—attempt to understand it from an insider’s point of view."}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p026-para-004", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 26, "chapter": 1, "section": "1.2", "score": 0.641802, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "In The Nature of Social Action, Weber described sociology as striving to “... interpret the meaning of social action and thereby give a causal explanation of the way in which action proceeds and the effects it produces.” He and other like-minded sociologists proposed a philosophy of anti-positivism whereby social researchers would strive for subjectivity as they worked to represent social processes, cultural norms, and societal values. This approach led to some research methods whose aim was not to generalize or predict (traditional in science), but to systematically gain an in-depth understanding of social worlds."}], "config": "B", "index": "B"}, {"id": "q01", "split": "dev", "type": "direct", "question": "What do sociologists call a group of people who live in a defined geographic area, interact with one another, and share a common culture?", "expected_answer": "A society.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [20], "evidence_quote": "A group of people who live in a defined geographic area, who interact with one another, and who share a common culture is what sociologists call a society.", "filter": null, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p020-para-003", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 20, "chapter": 1, "section": "1.1", "score": 0.795393, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "Sociology is the scientific and systematic study of groups and group interactions, societies and social interactions, from small and personal groups to very large groups. A group of people who live in a defined geographic area, who interact with one another, and who share a common culture is what sociologists call a society."}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p021-para-000", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 21, "chapter": 1, "section": "1.1", "score": 0.569087, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "The term culture refers to the group’s shared practices, values, and beliefs. Culture encompasses a group’s way of life, from routine, everyday interactions to the most important parts of group members’ lives. It includes everything produced by a society, including all the social rules."}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p021-para-002", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 21, "chapter": 1, "section": "1.1", "score": 0.522001, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "Remember, though, that culture is a product of the people in a society. Sociologists take care not to treat the concept of “culture” as though it were alive and real. The error of treating an abstract concept as though it has a real, material existence is known as reification (Sahn, 2013)."}], "config": "C", "index": "B"}, {"id": "q02", "split": "dev", "type": "paraphrase", "question": "What is the name for the mistake of treating an abstract idea such as culture as if it physically existed?", "expected_answer": "Reification.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [21], "evidence_quote": "The error of treating an abstract concept as though it has a real, material existence is known as reification", "filter": null, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p021-para-002", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 21, "chapter": 1, "section": "1.1", "score": 0.761956, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "Remember, though, that culture is a product of the people in a society. Sociologists take care not to treat the concept of “culture” as though it were alive and real. The error of treating an abstract concept as though it has a real, material existence is known as reification (Sahn, 2013)."}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p026-para-003", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 26, "chapter": 1, "section": "1.2", "score": 0.495282, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "Weber believed that it was difficult, if not impossible, to use standard scientific methods to accurately predict the behavior of groups as some sociologists hoped to do. Weber argued that the influence of culture on human behavior had to be taken into account. This even applied to the researchers themselves, who should be aware of how their own cultural biases could influence their research. To deal with this problem, Weber and Wilhelm Dilthey introduced the concept of verstehen, a German word that means to understand in a deep way. In seeking verstehen, outside observers of a social world—an entire culture or a small setting—attempt to understand it from an insider’s point of view."}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p021-para-001", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 21, "chapter": 1, "section": "1.1", "score": 0.486504, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "Sociologists often study culture using the sociological imagination, which pioneer sociologist C. Wright Mills described as an awareness of the relationship between a person’s behavior and experience and the wider culture that shaped the person’s choices and perceptions. It’s a way of seeing our own and other people’s behavior in relationship to history and social structure (1959). One illustration of this is a person’s decision to marry. In the United States, this choice is heavily influenced by individual feelings. However, the social acceptability of marriage relative to the person’s circumstances also plays a part."}], "config": "C", "index": "B"}, {"id": "q03", "split": "dev", "type": "direct", "question": "What term did Norbert Elias use for analyzing individuals and the society that shapes their behavior at the same time?", "expected_answer": "Figuration.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [22], "evidence_quote": "German sociologist Norbert Elias called the process of simultaneously analyzing the behavior of individuals and the society that shapes that behavior figuration.", "filter": null, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p022-para-001", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 22, "chapter": 1, "section": "1.1", "score": 0.708484, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "Studying Part and Whole: How Sociologists View Social Structures\n\nA key component of the sociological perspective is the idea that the individual and society are inseparable. It is impossible to study one without the other. German sociologist Norbert Elias called the process of simultaneously analyzing the behavior of individuals and the society that shapes that behavior figuration. Consider religion. While people experience religion in a distinctly individual manner, religion exists in a larger social context as a social institution. For instance, an individual’s religious practice may be influenced by what government dictates, holidays, teachers, places of worship, rituals, and so on. "}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p034-para-000", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 34, "chapter": 1, "section": "1.3", "score": 0.570798, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "to communicate their message.\n\nThe focus on the importance of symbols in building a society led sociologists like Erving Goffman (1922-1982) to develop a technique called dramaturgical analysis. Goffman used theater as an analogy for social interaction and recognized that people’s interactions showed patterns of cultural “scripts.” He argued that individuals were actors in a play. We switched roles, sometimes minute to minute—for example, from student or daughter to dog walker. Because it can be unclear what part a person may play in a given situation, he or she has to improvise his or her role as the situation unfolds (Goffman, 1958)."}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p022-para-002", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 22, "chapter": 1, "section": "1.1", "score": 0.569668, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "These influences underscore the important relationship between individual practices of religion and social pressures that influence that religious experience (Elias, 1978). In simpler terms, figuration means that as one analyzes the social institutions in a society, the individuals using that institution in any fashion need to be ‘figured’ in to the analysis."}], "config": "C", "index": "B"}, {"id": "q04", "split": "dev", "type": "condition_exception", "question": "Who first coined the term sociology, and was it Auguste Comte?", "expected_answer": "Emmanuel-Joseph Sieyès coined it in 1780 in an unpublished manuscript; Comte only reintroduced the term in 1838.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [24], "evidence_quote": "The term sociology was first coined in 1780 by the French essayist Emmanuel-Joseph Sieyès (1748–1836) in an unpublished manuscript (Fauré et al. 1999). In 1838, the term was reintroduced by Auguste Comte", "filter": null, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p024-para-002", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 24, "chapter": 1, "section": "1.2", "score": 0.782909, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "The term sociology was first coined in 1780 by the French essayist Emmanuel-Joseph Sieyès (1748–1836) in an unpublished manuscript (Fauré et al. 1999). In 1838, the term was reintroduced by Auguste Comte (1798–1857). Comte originally studied to be an engineer, but later became a pupil of social philosopher Claude Henri de Rouvroy Comte de Saint-Simon (1760–1825). They both thought that social scientists could study society using the same scientific methods utilized in natural sciences. Comte also believed in the potential of social scientists to work toward the betterment of society. He held that once scholars identified the laws that governed society, sociologists could address problems such as poor education and poverty (Abercrombie et al. 2000)."}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p024-para-001", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 24, "chapter": 1, "section": "1.2", "score": 0.550507, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "Creating a Discipline: European Theorists\n\nFIGURE 1.5 Early major European theorists. Top row, left to right: Auguste Comte, Harriet Martineau, and Herbert Spencer. Bottom row, left to right: Georg Simmel, Émile Durkheim, and Max Weber. (Credit: Wikimedia Commons; Julius Cornelius Schaarwächter/Public domain.)\n\nAuguste Comte (1798 – 1857)"}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p023-para-000", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 23, "chapter": 1, "section": "1.2", "score": 0.54517, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "FIGURE 1.4 People have been thinking like sociologists long before sociology became a distinct academic discipline: Plato and Aristotle, Confucius, Khaldun, Voltaire, and Mary Wollstonecraft set the stage for modern sociology. (Credit: A, B, C, and E Wikimedia Commons; D: publicdomainfiles.com.)"}], "config": "C", "index": "B"}, {"id": "q05", "split": "dev", "type": "direct", "question": "What was the first book to have the word sociology in its title, and who wrote it?", "expected_answer": "The Study of Sociology, published by Herbert Spencer in 1873.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [25], "evidence_quote": "In 1873, the English philosopher Herbert Spencer published The Study of Sociology, the first book with the term “sociology” in the title.", "filter": null, "filter_applied": null, "hit@1": false, "hit@3": true, "first_hit_rank": 2, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p024-para-002", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 24, "chapter": 1, "section": "1.2", "score": 0.673761, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "The term sociology was first coined in 1780 by the French essayist Emmanuel-Joseph Sieyès (1748–1836) in an unpublished manuscript (Fauré et al. 1999). In 1838, the term was reintroduced by Auguste Comte (1798–1857). Comte originally studied to be an engineer, but later became a pupil of social philosopher Claude Henri de Rouvroy Comte de Saint-Simon (1760–1825). They both thought that social scientists could study society using the same scientific methods utilized in natural sciences. Comte also believed in the potential of social scientists to work toward the betterment of society. He held that once scholars identified the laws that governed society, sociologists could address problems such as poor education and poverty (Abercrombie et al. 2000)."}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p025-para-005", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 25, "chapter": 1, "section": "1.2", "score": 0.623037, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "In 1873, the English philosopher Herbert Spencer published The Study of Sociology, the first book with the term “sociology” in the title. Spencer rejected much of Comte’s philosophy as well as Marx’s theory of class struggle and his support of communism. Instead, he favored a form of government that allowed market forces to control capitalism. His work influenced many early sociologists including Émile Durkheim (1858–1917). Spencer, using Charles Darwin’s work as a comparison said, “This survival of the fittest, which I have here sought to express in mechanical terms, is that which Mr. Darwin has called ‘natural selection,’ or the preservation of favoured races in the struggle for life.” "}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p026-para-000", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 26, "chapter": 1, "section": "1.2", "score": 0.571742, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "and analyzed the dynamics of two-person and three-person groups. His work also emphasized individual culture as the creative capacities of individuals (Ritzer and Goodman 2004).\n\nÉmile Durkheim (1858–1917)\n\nÉmile Durkheim helped establish sociology as a formal academic discipline by establishing the first European department of sociology at the University of Bordeaux in 1895 and by publishing his Rules of the Sociological Method in 1895. In Division of Labour in Society (1893), Durkheim further laid out his theory on how societies transformed from a primitive state into a capitalist, industrial society. According to Durkheim, people rise to their proper levels in society based on merit."}], "config": "C", "index": "B"}, {"id": "q06", "split": "dev", "type": "direct", "question": "Where and when did Émile Durkheim establish the first European department of sociology?", "expected_answer": "At the University of Bordeaux in 1895.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [26], "evidence_quote": "establishing the first European department of sociology at the University of Bordeaux in 1895", "filter": null, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p026-para-000", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 26, "chapter": 1, "section": "1.2", "score": 0.758289, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "and analyzed the dynamics of two-person and three-person groups. His work also emphasized individual culture as the creative capacities of individuals (Ritzer and Goodman 2004).\n\nÉmile Durkheim (1858–1917)\n\nÉmile Durkheim helped establish sociology as a formal academic discipline by establishing the first European department of sociology at the University of Bordeaux in 1895 and by publishing his Rules of the Sociological Method in 1895. In Division of Labour in Society (1893), Durkheim further laid out his theory on how societies transformed from a primitive state into a capitalist, industrial society. According to Durkheim, people rise to their proper levels in society based on merit."}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p027-para-003", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 27, "chapter": 1, "section": "1.2", "score": 0.571972, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "In the early 1900s, sociology reached universities in the United States. William Sumner held the first professorship in sociology (Yale University), Franklin Giddings was the first full professor of Sociology (Columbia University), and Albion Small wrote the first sociology textbook. Early American sociologists tested and applied the theories of the Europeans and became leaders in social research. Lester Ward (1841 – 1913) developed social research methods and argued for the use of the scientific method and quantitative data (Chapter 2) to show the effectiveness of policies. In order for sociology to gain respectability in American academia, social researchers understood that they must adopt empirical approaches.\n\nW.E.B. Du Bois (1868-1963)"}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p024-para-001", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 24, "chapter": 1, "section": "1.2", "score": 0.55719, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "Creating a Discipline: European Theorists\n\nFIGURE 1.5 Early major European theorists. Top row, left to right: Auguste Comte, Harriet Martineau, and Herbert Spencer. Bottom row, left to right: Georg Simmel, Émile Durkheim, and Max Weber. (Credit: Wikimedia Commons; Julius Cornelius Schaarwächter/Public domain.)\n\nAuguste Comte (1798 – 1857)"}], "config": "C", "index": "B"}, {"id": "q07", "split": "dev", "type": "paraphrase", "question": "Which sociologist said people judge themselves by how others react to them, and what did he call this idea?", "expected_answer": "Charles Horton Cooley; the looking-glass self.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [28], "evidence_quote": "Calling this idea ‘the looking-glass self,’ Cooley argued that we ‘see’ ourselves by the reactions of others with whom we interact.", "filter": null, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p028-para-004", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 28, "chapter": 1, "section": "1.2", "score": 0.694902, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "Charles Horton Cooley posited that individuals compare themselves to others in order to check themselves against social standards and remain part of the group. Calling this idea ‘the looking-glass self,’ Cooley argued that we ‘see’ ourselves by the reactions of others with whom we interact. If someone reacts positively to our behavior, theoretically we will continue that behavior. He wrote substantially on what he saw as the order of life in Human Nature and the Social Order (1902) followed by Social Organization in 1909. He was very concerned with the increasing individualism and competitiveness of US society, fearing it would disrupt families as primary groups lost their importance.\n\nGeorge Herbert Mead (1863–1931)"}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p028-para-005", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 28, "chapter": 1, "section": "1.2", "score": 0.661327, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "George Herbert Mead was a philosopher and sociologist whose work focused on the ways in which the mind and the self were developed as a result of social processes (Cronk, n.d.). He argued that how an individual comes to view himself or herself is based to a very large extent on interactions with others. Though Mead adopted Cooley’s concept of ‘looking-glasses,’ Mead felt that an individual’s reaction to a positive or negative reflection depended on who the ‘other’ was. Individuals that had the greatest impact on a person’s life were significant others while generalized others were the organized and generalized attitude of a social group. Mead often shares the title of father of symbolic interactionism with Cooley and Erving Goffman. Robert E. Park (1864-1944)"}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p034-para-000", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 34, "chapter": 1, "section": "1.3", "score": 0.541651, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "to communicate their message.\n\nThe focus on the importance of symbols in building a society led sociologists like Erving Goffman (1922-1982) to develop a technique called dramaturgical analysis. Goffman used theater as an analogy for social interaction and recognized that people’s interactions showed patterns of cultural “scripts.” He argued that individuals were actors in a play. We switched roles, sometimes minute to minute—for example, from student or daughter to dog walker. Because it can be unclear what part a person may play in a given situation, he or she has to improvise his or her role as the situation unfolds (Goffman, 1958)."}], "config": "C", "index": "B"}, {"id": "q08", "split": "dev", "type": "direct", "question": "According to Robert Merton, what is the difference between manifest and latent functions?", "expected_answer": "Manifest functions are sought or anticipated consequences of a social process; latent functions are unsought consequences.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [30], "evidence_quote": "Manifest functions are the consequences of a social process that are sought or anticipated, while latent functions are the unsought consequences of a social process.", "filter": null, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p030-para-005", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 30, "chapter": 1, "section": "1.3", "score": 0.790547, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "Another noted structural functionalist, Robert Merton (1910–2003), pointed out that social processes often have many functions. Manifest functions are the consequences of a social process that are sought or anticipated, while latent functions are the unsought consequences of a social process. A manifest function of a college education, for example, includes gaining knowledge, preparing for a career, and finding a good job that utilizes that education. Latent functions of your college years include meeting new people, participating in extracurricular activities, or even finding a spouse or partner. Another latent function of education is creating"}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p031-para-000", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 31, "chapter": 1, "section": "1.3", "score": 0.658, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "a hierarchy of employment based on the level of education attained. Latent functions can be beneficial, neutral, or harmful. Social processes that have undesirable consequences for the operation of society are called dysfunctions. In education, examples of dysfunction include getting bad grades, truancy, dropping out, not graduating, and not finding suitable employment."}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p030-para-003", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 30, "chapter": 1, "section": "1.3", "score": 0.535702, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "Alfred Radcliffe-Brown (1881–1955), a social anthropologist, defined the function of any recurrent activity as the part it played in social life as a whole, and therefore the contribution it makes to social stability and continuity (Radcliffe-Brown 1952). In a healthy society, all parts work together to maintain stability, a state called dynamic equilibrium by later sociologists such as Parsons (1961). Durkheim believed that individuals may make up society, but in order to study society, sociologists have to look beyond individuals to social facts. Each of these social facts serves one or more functions within a society. "}], "config": "C", "index": "B"}, {"id": "q09", "split": "dev", "type": "paraphrase", "question": "Which technique used theater as an analogy for social interaction, and who developed it?", "expected_answer": "Dramaturgical analysis, developed by Erving Goffman.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [34], "evidence_quote": "Erving Goffman (1922-1982) to develop a technique called dramaturgical analysis. Goffman used theater as an analogy for social interaction", "filter": null, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p034-para-000", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 34, "chapter": 1, "section": "1.3", "score": 0.747185, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "to communicate their message.\n\nThe focus on the importance of symbols in building a society led sociologists like Erving Goffman (1922-1982) to develop a technique called dramaturgical analysis. Goffman used theater as an analogy for social interaction and recognized that people’s interactions showed patterns of cultural “scripts.” He argued that individuals were actors in a play. We switched roles, sometimes minute to minute—for example, from student or daughter to dog walker. Because it can be unclear what part a person may play in a given situation, he or she has to improvise his or her role as the situation unfolds (Goffman, 1958)."}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p033-para-004", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 33, "chapter": 1, "section": "1.3", "score": 0.60627, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "Symbolic Interactionist Theory\n\nSymbolic interactionism is a micro-level theory that focuses on the relationships among individuals within a society. Communication—the exchange of meaning through language and symbols—is believed to be the way in which people make sense of their social worlds. Theorists Herman and Reynolds (1994) note that this perspective sees people as being active in shaping the social world rather than simply being acted upon. George Herbert Mead is considered a founder of symbolic interactionism though he never published his work on it (LaRossa and Reitzes, 1993). "}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p028-para-005", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 28, "chapter": 1, "section": "1.2", "score": 0.555308, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "George Herbert Mead was a philosopher and sociologist whose work focused on the ways in which the mind and the self were developed as a result of social processes (Cronk, n.d.). He argued that how an individual comes to view himself or herself is based to a very large extent on interactions with others. Though Mead adopted Cooley’s concept of ‘looking-glasses,’ Mead felt that an individual’s reaction to a positive or negative reflection depended on who the ‘other’ was. Individuals that had the greatest impact on a person’s life were significant others while generalized others were the organized and generalized attitude of a social group. Mead often shares the title of father of symbolic interactionism with Cooley and Erving Goffman. Robert E. Park (1864-1944)"}], "config": "C", "index": "B"}, {"id": "q10", "split": "dev", "type": "direct", "question": "In the hypothesis 'if unemployment increases, then the crime rate will increase', which is the independent variable and which is the dependent variable?", "expected_answer": "Unemployment is the independent variable; the crime rate is the dependent variable.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [50], "evidence_quote": "unemployment is the independent variable and the crime rate is the dependent variable.", "filter": null, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p050-para-003", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 50, "chapter": 2, "section": "2.1", "score": 0.861215, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "Step 3: Formulate a Hypothesis\n\nA hypothesis is an explanation for a phenomenon based on a conjecture about the relationship between the phenomenon and one or more causal factors. In sociology, the hypothesis will often predict how one form of human behavior influences another. For example, a hypothesis might be in the form of an “if, then” statement. Let’s relate this to our topic of crime: If unemployment increases, then the crime rate will increase. In scientific research, we formulate hypotheses to include an independent variable (IV), which is the cause of the change, and a dependent variable (DV), which is the effect, or thing that is changed. In the example above, unemployment is the independent variable and the crime rate is the dependent variable."}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p050-para-004", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 50, "chapter": 2, "section": "2.1", "score": 0.718229, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "In a sociological study, the researcher would establish one form of human behavior as the independent variable and observe the influence it has on a dependent variable. How does gender (the independent variable) affect rate of income (the dependent variable)? How does one’s religion (the independent variable) affect family size (the dependent variable)? How is social class (the dependent variable) affected by level of education (the independent variable)?\n\nHypothesis Independent\n\nVariable\n\nDependent\n\nVariable\n\nThe greater the availability of affordable housing, the lower the\n\nhomeless rate. Affordable Housing Homeless Rate The greater the availability of math tutoring, the higher the math"}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p051-para-000", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 51, "chapter": 2, "section": "2.1", "score": 0.687929, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "Taking an example from Table 12.1, a researcher might hypothesize that teaching children proper hygiene (the independent variable) will boost their sense of self-esteem (the dependent variable). Note, however, this hypothesis can also work the other way around. A sociologist might predict that increasing a child’s sense of self-esteem (the independent variable) will increase or improve habits of hygiene (now the dependent variable). Identifying the independent and dependent variables is very important. As the hygiene example shows, simply identifying related two topics or variables is not enough. Their prospective relationship must be part of the hypothesis."}], "config": "C", "index": "B"}, {"id": "q11", "split": "dev", "type": "paraphrase", "question": "Which research quality describes how well a study measures what it was designed to measure?", "expected_answer": "Validity.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [51], "evidence_quote": "Researchers also strive for validity, which refers to how well the study measures what it was designed to measure.", "filter": null, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p051-para-002", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 51, "chapter": 2, "section": "2.1", "score": 0.681464, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "Researchers also strive for validity, which refers to how well the study measures what it was designed to measure. To produce reliable and valid results, sociologists develop an operational definition, that is, they define each concept, or variable, in terms of the physical or concrete steps it takes to objectively measure it. The operational definition identifies an observable condition of the concept. By operationalizing the concept, all researchers can collect data in a systematic or replicable manner. Moreover, researchers can determine whether the experiment or method validly represent the phenomenon they intended to study. "}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p048-para-000", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 48, "chapter": 2, "section": "2.0", "score": 0.636219, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "approaches and methods sociologists use to conduct studies like this one.\n\n2.1 Approaches to Sociological Research\n\nLEARNING OBJECTIVES\n\nBy the end of this section, you should be able to:\n\n• Define and describe the scientific method.\n\n• Explain how the scientific method is used in sociological research.\n\n• Describe the function and importance of an interpretive framework.\n\n• Describe the differences in accuracy, reliability and validity in a research study."}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p051-para-001", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 51, "chapter": 2, "section": "2.1", "score": 0.584552, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "Step 4: Design and Conduct a Study\n\nResearchers design studies to maximize reliability, which refers to how likely research results are to be replicated if the study is reproduced. Reliability increases the likelihood that what happens to one person will happen to all people in a group or what will happen in one situation will happen in another. Cooking is a science. When you follow a recipe and measure ingredients with a cooking tool, such as a measuring cup, the same results is obtained as long as the cook follows the same recipe and uses the same type of tool. The measuring cup introduces accuracy into the process. If a person uses a less accurate tool, such as their hand, to measure ingredients rather than a cup, the same result may not be replicated. Accurate tools and methods increase reliability."}], "config": "C", "index": "B"}, {"id": "q12", "split": "dev", "type": "direct", "question": "What defines a random sample?", "expected_answer": "Every person in the population has the same chance of being chosen for the study.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [54], "evidence_quote": "In a random sample, every person in a population has the same chance of being chosen for the study.", "filter": null, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p054-para-001", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 54, "chapter": 2, "section": "2.2", "score": 0.670642, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "A survey targets a specific population, people who are the focus of a study, such as college athletes, international students, or teenagers living with type 1 (juvenile-onset) diabetes. Most researchers choose to survey a small sector of the population, or a sample, a manageable number of subjects who represent a larger population. The success of a study depends on how well a population is represented by the sample. In a random sample, every person in a population has the same chance of being chosen for the study. As a result, a Gallup Poll, if conducted as a nationwide random sampling, should be able to provide an accurate estimate of public opinion whether it contacts 2,000 or 10,000 people."}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p051-para-002", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 51, "chapter": 2, "section": "2.1", "score": 0.457687, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "Researchers also strive for validity, which refers to how well the study measures what it was designed to measure. To produce reliable and valid results, sociologists develop an operational definition, that is, they define each concept, or variable, in terms of the physical or concrete steps it takes to objectively measure it. The operational definition identifies an observable condition of the concept. By operationalizing the concept, all researchers can collect data in a systematic or replicable manner. Moreover, researchers can determine whether the experiment or method validly represent the phenomenon they intended to study. "}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p053-para-003", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 53, "chapter": 2, "section": "2.2", "score": 0.452921, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "Not all surveys are considered sociological research, however, and many surveys people commonly encounter focus on identifying marketing needs and strategies rather than testing a hypothesis or contributing to social science knowledge. Questions such as, “How many hot dogs do you eat in a month?” or “Were the staff helpful?” are not usually designed as scientific research. The Nielsen Ratings determine the popularity of television programming through scientific market research. However, polls conducted by television programs such as American Idol or So You Think You Can Dance cannot be generalized, because they are administered to an unrepresentative population, a specific show’s audience. "}], "config": "C", "index": "B"}, {"id": "q13", "split": "dev", "type": "condition_exception", "question": "Why is the Hawthorne effect unavoidable in some research studies?", "expected_answer": "Because sociologists have to make the purpose of the study known, so subjects know they are being observed.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [63], "evidence_quote": "The Hawthorne effect is unavoidable in some research studies because sociologists have to make the purpose of the study known.", "filter": null, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p063-para-003", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 63, "chapter": 2, "section": "2.2", "score": 0.824025, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "And if a researcher told the students they would be observed as part of a study on measuring the effectiveness of tutoring, the students might not behave naturally. This is called the Hawthorne effect—which occurs when people change their behavior because they know they are being watched as part of a study. The Hawthorne effect is unavoidable in some research studies because sociologists have to make the purpose of the study known. Subjects must be aware that they are being observed, and a certain amount of artificiality may result (Sonnenfeld 1985).\n\nFIGURE 2.10 Sociologist Frances Heussenstamm conducted research to explore the correlation between traffic stops and race-based bumper stickers. This issue of racial profiling remains a hot-button topic today. (Credit: dwightsghost/flickr)"}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p058-para-003", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 58, "chapter": 2, "section": "2.2", "score": 0.576426, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "The Lynds were upfront about their mission. The townspeople of Muncie, Indiana, knew why the researchers were in their midst. But some sociologists prefer not to alert people to their presence. The main advantage of covert participant observation is that it allows the researcher access to authentic, natural behaviors of a group’s members. The challenge, however, is gaining access to a setting without disrupting the pattern of others’ behavior. Becoming an inside member of a group, organization, or subculture takes time and effort. Researchers must pretend to be something they are not. The process could involve role playing, making"}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p053-para-000", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 53, "chapter": 2, "section": "2.2", "score": 0.570297, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "When entering a particular social environment, a researcher must be careful. There are times to remain anonymous and times to be overt. There are times to conduct interviews and times to simply observe. Some participants need to be thoroughly informed; others should not know they are being observed. A researcher wouldn’t stroll into a crime-ridden neighborhood at midnight, calling out, “Any gang members around?” Making sociologists’ presence invisible is not always realistic for other reasons. That option is not available to a researcher studying prison behaviors, early education, or the Ku Klux Klan. Researchers can’t just stroll into prisons, kindergarten classrooms, or Klan meetings and unobtrusively observe behaviors or attract attention. "}], "config": "C", "index": "B"}, {"id": "q14", "split": "dev", "type": "metadata_filter", "question": "What did the Frankfurt School develop as an elaboration on Marxist principles?", "expected_answer": "Critical theory.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [32], "evidence_quote": "In the 1930s and 1940s, German philosophers, known as the Frankfurt School, developed critical theory as an elaboration on Marxist principles.", "filter": {"chapter": 1}, "filter_applied": {"chapter": 1}, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": true, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p032-para-005", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 32, "chapter": 1, "section": "1.3", "score": 0.711416, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "In the 1930s and 1940s, German philosophers, known as the Frankfurt School, developed critical theory as an elaboration on Marxist principles. Critical theory is an expansion of conflict theory and is broader than just sociology, incorporating other social sciences and philosophy. A critical theory is a holistic theory and attempts to address structural issues causing inequality. It must explain what’s wrong in current social reality, identify the people who can make changes, and provide practical goals for social transformation (Horkeimer, 1982)."}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p025-para-003", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 25, "chapter": 1, "section": "1.2", "score": 0.546823, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "Karl Marx was a German philosopher and economist. In 1848, he and Friedrich Engels (1820–1895) coauthored the Communist Manifesto. This book is one of the most influential political manuscripts in history. It also presents Marx’s theory of society, which differed from what Comte proposed.\n\nMarx rejected Comte’s positivism. He believed that societies grew and changed as a result of the struggles of different social classes over the means of production. At the time he was developing his theories, the Industrial Revolution and the rise of capitalism led to great disparities in wealth between the owners of the factories and workers. Capitalism, an economic system characterized by private or corporate ownership of goods and the means to produce them, had developed in many nations."}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p034-para-005", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 34, "chapter": 1, "section": "1.3", "score": 0.521422, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "Conflict theory then gained prominence, with its emphasis on institutionalized social inequality. Critical theory, and the particular aspects of feminist theory and critical race theory, focused on creating social change through the application of sociological principles. The field saw a renewed emphasis on helping ordinary people understand sociology principles, in the form of public sociology."}], "config": "C", "index": "B"}, {"id": "q15", "split": "dev", "type": "metadata_filter", "question": "What ethical concern did Max Weber identify for sociological research?", "expected_answer": "Personal values must not shape interpretation of results; sociologists must establish value neutrality.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [65], "evidence_quote": "Sociologists, he stated, must establish value neutrality, a practice of remaining impartial, without bias or judgment, during the course of a study and in publishing results", "filter": {"chapter": 2}, "filter_applied": {"chapter": 2}, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": true, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p065-para-003", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 65, "chapter": 2, "section": "2.3", "score": 0.820806, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "Pioneer German sociologist Max Weber (1864–1920) identified another crucial ethical concern. Weber understood that personal values could distort the framework for disclosing study results. While he accepted that some aspects of research design might be influenced by personal values, he declared it was entirely inappropriate to allow personal values to shape the interpretation of the responses. Sociologists, he stated, must establish value neutrality, a practice of remaining impartial, without bias or judgment, during the course of a study and in publishing results (Weber, 1949). Sociologists are obligated to disclose research findings without omitting or distorting significant data."}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p065-para-002", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 65, "chapter": 2, "section": "2.3", "score": 0.609093, "gold_page_match": true, "evidence_full": false, "evidence_partial": false, "text": "• Understand why ethical standards exist\n\n• Investigate unethical studies\n\n• Demonstrate awareness of the American Sociological Association’s Code of Ethics Sociologists conduct studies to shed light on human behaviors. Knowledge is a powerful tool that can be used to achieve positive change. As a result, conducting a sociological study comes with a tremendous amount of responsibility. Like all researchers, sociologists must consider their ethical obligation to avoid harming human subjects or groups while conducting research."}, {"rank": 3, "chunk_id": "openstax-intro-sociology-3e-p047-para-000", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 47, "chapter": 2, "section": "2.0", "score": 0.572647, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "FIGURE 2.1 Many believe that crime rates go up during the full moon, but scientific research does not support this conclusion. (Credit: Arman Thanvir/flickr.)\n\n2.1 Approaches to Sociological Research\n\n2.2 Research Methods\n\n2.3 Ethical Concerns\n\nAs sociology made its way into American universities, scholars developed it into a science that relies on research to build a body of knowledge. Sociologists began collecting data (observations and documentation) and applying the scientific method or an interpretative framework to increase understanding of societies and social interactions."}], "config": "C", "index": "B"}], "test": [{"id": "t01", "split": "test", "type": "condition_exception", "question": "Case studies are rarely a primary method, but in what situation are they especially useful?", "expected_answer": "When the single case is unique, e.g. a feral child.", "gold_source_id": "openstax-intro-sociology-3e", "gold_page": [62], "evidence_quote": "However, case studies are useful when the single case is unique.", "filter": null, "filter_applied": null, "hit@1": true, "hit@3": true, "first_hit_rank": 1, "failure": null, "filter_compliant": null, "manual_override": null, "top_k": [{"rank": 1, "chunk_id": "openstax-intro-sociology-3e-p062-fixed-002", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 62, "chapter": 2, "section": "2.2", "score": 0.70379, "gold_page_match": true, "evidence_full": true, "evidence_partial": false, "text": "ne person, since one person does not verify a pattern. This is why most sociologists do not use case studies as a primary research method.\n\nHowever, case studies are useful when the single case is unique. In these instances, a single case study can contribute tremendous insight. For example, a feral child, also called “wild child,” is one who grows up isolated from human beings. Feral children grow up without social contact and language, which are elements crucial to a “civilized” child’s develo"}, {"rank": 2, "chunk_id": "openstax-intro-sociology-3e-p052-fixed-007", "document_id": "openstax-intro-sociology-3e", "source": "https://openstax.org/details/books/introduction-sociology-3e", "page": 52, "chapter": 2, "section": "2.2", "score": 0.658103, "gold_page_match": false, "evidence_full": false, "evidence_partial": false, "text": "e research design is a key step in any sociological study. Sociologists generally choose from widely used methods of social investigation: primary source data collection such as survey, participant observation, ethnography, case study, unobtrusive observations, experiment, and secondary data analysis,
